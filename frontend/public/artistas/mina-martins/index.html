 $$(".acard").forEach(a=>a.onclick=()=>abreArchivo(A.archivo.obras[+a.dataset.arch],a));
 $$(".vb[data-yt]").forEach(b=>b.onclick=()=>{b.outerHTML=`<iframe class="vb" src="https://www.youtube-nocookie.com/embed/${b.dataset.yt}?autoplay=1&rel=0" title="${esc(b.dataset.t)}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="aspect-ratio:16/9;width:100%;border:0;display:block"></iframe>`});
 const vm=$("#verMama"); if(vm)vm.onclick=()=>abre(vm.dataset.obra,vm);
 $$(".zoom").forEach(z=>z.onclick=()=>z.dataset.pieza!==undefined?abrePieza(PIEZAS[+z.dataset.pieza],z):abre(z.dataset.obra,z));
}

/* tarjeta de video: YouTube (clic para cargar el reproductor) o enlace a Drive */
function vidCard(v){
 const cuerpo=`<div class="vt"><span class="mono">${esc(v.anio||"")}</span><b>${esc(v.t)}</b><small>${esc(v.fuente)} ${chip(v.estado||"por_validar")}</small></div>`;
 if(v.yt)return `<article class="vc"><button type="button" class="vb" data-yt="${esc(v.yt)}" data-t="${esc(v.t)}" aria-label="Reproducir: ${esc(v.t)}"><img src="https://i.ytimg.com/vi/${esc(v.yt)}/hqdefault.jpg" alt="" loading="lazy"><span class="pl" aria-hidden="true">▶</span></button>${cuerpo}</article>`;
 return `<article class="vc"><a class="vb" href="${esc(v.url)}" target="_blank" rel="noopener" aria-label="Abrir: ${esc(v.t)}" style="display:grid;place-items:center;background:#232322;color:#fff;text-decoration:none"><span class="pl" aria-hidden="true" style="position:static;transform:none">▶</span></a>${cuerpo}</article>`;
}

function pintaGrid(){
 let L=O.filter(o=>filtro==="todo"||o.categoria===filtro);
 L.sort((a,b)=>orden==="precio-asc"?a.precio-b.precio:orden==="disp"?(b.existencia>0)-(a.existencia>0)||b.precio-a.precio:b.precio-a.precio);
 const total=L.length; L=L.slice(0,visibles);
 $("#more").innerHTML=total>visibles?`<button type="button" id="moreBtn">Ver más obras (${total-visibles})</button>`:"";
 if($("#moreBtn"))$("#moreBtn").onclick=()=>{visibles+=9;pintaGrid()};
 $("#grid").innerHTML=L.length?L.map(o=>`<button class="card ${o.existencia>0?"":"sold"}" type="button" data-id="${esc(o.id)}" aria-label="Ver ${esc(o.titulo)}">
   <div class="im"><span class="st chip ${o.existencia>0?"":"v"}">${o.existencia>0?"Disponible":"Vendida"}</span><img src="${cdn(o.imgs[0],640)}" alt="${esc(o.titulo)}, ${esc(o.tecnica||"")}" loading="lazy"></div>
   <div class="bd"><h3>${esc(o.titulo)}</h3><span class="mt">${esc(o.tecnica||"")}${o.medidas?" · "+esc(o.medidas):""}</span><span class="pr">${money(o.precio)}</span></div></button>`).join(""):'<div class="empty">No hay obras en esta técnica por ahora.</div>';
 $$("#grid .card").forEach(c=>c.onclick=()=>abre(c.dataset.id,c));
}

let lastFocus=null;
function abre(id,from){
 const o=O.find(x=>x.id===id); if(!o)return; lastFocus=from||document.activeElement;
 const wa=`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(`Hola, me interesa la obra «${o.titulo}» de ${A.nombre} (${money(o.precio)}). ¿Me ayudan?`)}`;
 $("#modal").innerHTML=`<div class="mod" style="position:relative">
  <div class="g"><div class="main"><img id="mImg" src="${cdn(o.imgs[0],1200)}" alt="${esc(o.titulo)}"></div>
   <div class="thumbs">${o.imgs.map((u,i)=>`<button type="button" data-i="${i}" aria-current="${i===0}" aria-label="Foto ${i+1}"><img src="${cdn(u,160)}" alt=""></button>`).join("")}</div></div>
  <div class="i"><button class="sm x" id="mClose" type="button" aria-label="Cerrar">✕</button>
   <span class="mono">${esc(A.nombre)}</span><h3 id="mTitle">${esc(o.titulo)}</h3>
   <div>${esc(o.tecnica||"")}${o.medidas?"<br>"+esc(o.medidas):""}</div>
   <div class="pr">${money(o.precio)}</div>
   <div><span class="chip ${o.existencia>0?"":"v"}">${o.existencia>0?"Disponible":"Vendida"}</span></div>
   <div class="acts">${o.existencia>0?`<a class="btn pri" href="${esc(o.url)}" target="_blank" rel="noopener">Comprar en la tienda ↗</a>`:`<a class="btn" href="#encargo" id="mSim">Pedir algo parecido</a>`}
    <a class="btn" href="${wa}" target="_blank" rel="noopener">Preguntar por esta obra</a></div>
   <p class="src">Obra original hecha por ${esc(A.nombre)}. Se puede enmarcar bajo pedido.</p></div></div>`;
 $("#modal").classList.add("on"); document.body.style.overflow="hidden";
 $$(".thumbs button").forEach(b=>b.onclick=()=>{$("#mImg").src=cdn(o.imgs[b.dataset.i],1200);$$(".thumbs button").forEach(x=>x.setAttribute("aria-current",x===b))});
 $("#mClose").onclick=cierra; const s=$("#mSim"); if(s)s.onclick=cierra; $("#mClose").focus();
}
/* obra de archivo (ya no está en la tienda): imagen grande, datos de la ficha y contacto */
function abreArchivo(o,from){
 lastFocus=from||document.activeElement;
 const wa=`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(`Hola, me interesa algo parecido a «${o.t}» (${o.anio}) de ${A.nombre}. ¿Me ayudan?`)}`;
 $("#modal").innerHTML=`<div class="mod" style="position:relative">
  <div class="g"><div class="main" style="background:#000"><img src="${esc(o.img)}" alt="${esc(o.t)}"></div></div>
  <div class="i"><button class="sm x" id="mClose" type="button" aria-label="Cerrar">✕</button>
   <span class="mono">${esc(A.nombre)} · Archivo</span><h3 id="mTitle">${esc(o.t)}</h3>
   <div>${esc(o.tec)}<br>${esc(o.med)} · ${esc(o.anio)}</div>
   <div><span class="chip">Obra de archivo</span> <span class="chip v">Por validar</span></div>
   <div class="acts"><a class="btn pri" href="#encargo" id="mSim">Pedir algo parecido</a><a class="btn" href="${wa}" target="_blank" rel="noopener">Preguntar por WhatsApp</a></div>
   <p class="src">Esta obra es de archivo y no está en la tienda. Si sigue disponible o quién la tiene hoy, se confirma con el artista.</p></div></div>`;
 $("#modal").classList.add("on"); document.body.style.overflow="hidden";
 $("#mClose").onclick=cierra; $("#mSim").onclick=cierra; $("#mClose").focus();
}
/* piezas sin ficha en la tienda (p. ej. cerámica): foto completa y contacto, sin precio ni compra en línea */
function abrePieza(e,from){
 lastFocus=from||document.activeElement;
 const wa=`https://wa.me/${A.whatsapp}?text=${encodeURIComponent(`Hola, me interesa la pieza en barro «${e.titulo||"sin título"}» de ${A.nombre}. ¿Está disponible?`)}`;
 $("#modal").innerHTML=`<div class="mod" style="position:relative">
  <div class="g"><div class="main"><img src="${esc(e.completa)}" alt="${esc(e.titulo||e.pie)}"></div></div>
  <div class="i"><button class="sm x" id="mClose" type="button" aria-label="Cerrar">✕</button>
   <span class="mono">${esc(A.nombre)}</span><h3 id="mTitle">${esc(e.titulo||"Pieza en barro")}</h3>
   <div>Cerámica · barro de alta temperatura</div>
   <div><span class="chip v">Por validar</span></div>
   <div class="acts"><a class="btn pri" href="${wa}" target="_blank" rel="noopener">Preguntar por esta pieza</a><a class="btn" href="#encargo" id="mSim">Pedir algo parecido</a></div>
   <p class="src">Esta pieza no está en la tienda: el título, las medidas, el precio y la disponibilidad se confirman con el artista.</p></div></div>`;
 $("#modal").classList.add("on"); document.body.style.overflow="hidden";
 $("#mClose").onclick=cierra; $("#mSim").onclick=cierra; $("#mClose").focus();
}
function cierra(){$("#modal").classList.remove("on");document.body.style.overflow="";if(lastFocus&&lastFocus.focus)lastFocus.focus()}
$("#modal").addEventListener("mousedown",e=>{if(e.target.id==="modal")cierra()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").classList.contains("on"))cierra()});

function enviar(e){
 e.preventDefault();
 const v=id=>$("#"+id).value.trim(), err=$("#q_err");
 const tipo=($('input[name="tipo"]:checked')||{}).value||"";
 if($("#q_web").value)return;
 if(!v("q_nom")||v("q_tel").replace(/\D/g,"").length<10){err.textContent="Escribe tu nombre y un WhatsApp de 10 dígitos.";err.hidden=false;return}
 err.hidden=true;
 const txt=[`Hola, quiero hacer un encargo con ${A.nombre}.`,`Qué: ${tipo}`,v("q_desc")&&`Idea: ${v("q_desc")}`,v("q_med")&&`Medida: ${v("q_med")}`,v("q_fecha")&&`Para cuándo: ${v("q_fecha")}`,v("q_pres")&&`Presupuesto: ${v("q_pres")}`,`Nombre: ${v("q_nom")}`,`WhatsApp: ${v("q_tel")}`].filter(Boolean).join("\n");
 const d=$("#q_done"); d.hidden=false;
 d.innerHTML=`<b>Casi listo.</b><br>Revisa tu solicitud y envíala por WhatsApp a CUCO ARTS; nosotros te conectamos con el artista:<pre>${esc(txt)}</pre>
  <a class="btn pri" href="https://wa.me/${A.whatsapp}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Enviar por WhatsApp</a>`;
 d.scrollIntoView({behavior:"smooth",block:"center"});
}
boot();
