@font-face{font-family:"Neue Montreal";src:local("Neue Montreal"),local("NeueMontreal-Regular");font-weight:400}
@font-face{font-family:"Neue Montreal";src:local("Neue Montreal Bold"),local("NeueMontreal-Bold");font-weight:700}
:root{
  --bg:#F5F1F1; --surface:#FFFFFF; --ink:#232322; --muted:#5B5F49; --line:#D9D3CD;
  --red:#FA2713; --cream:#FFE7CF; --blue:#067DFF; --violet:#644DEF; --yellow:#F7D649; --lime:#C7F74E; --sky:#ABCFDD;
  --z-centro:#FF4B1F; --z-norte:#F7D649; --z-oriente:#644DEF; --z-sur:#C7F74E; --z-poniente:#067DFF; --z-santiago:#C1C68F;
  --on-centro:#FFFFFF; --on-norte:#232322; --on-oriente:#FFFFFF; --on-sur:#232322; --on-poniente:#FFFFFF; --on-santiago:#232322;
  --map:#E9E3DA; --water:#7FB6CC; --river:#2F6F8A; --mtn:#4C5239; --mtn2:#8E9470; --mtntxt:#F5F1F1;
  --shadow:0 10px 30px rgba(35,35,34,.12);
  --sans:"Neue Montreal","Helvetica Neue",Helvetica,Arial,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#171716; --surface:#232322; --ink:#F5F1F1; --muted:#B8B8A8; --line:#3A3A37; --map:#2B2B28; --water:#3E6A7D; --river:#8CC6DB; --mtn:#6E7656; --mtn2:#A3AA83;
  --shadow:0 10px 30px rgba(0,0,0,.45);color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#171716; --surface:#232322; --ink:#F5F1F1; --muted:#B8B8A8; --line:#3A3A37; --map:#2B2B28; --water:#3E6A7D; --river:#8CC6DB; --mtn:#6E7656; --mtn2:#A3AA83;
    --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--sans);text-transform:uppercase;letter-spacing:.07em;font-size:11.5px;font-weight:700}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}

.demo{background:var(--ink);color:var(--bg);font-size:12px;padding:8px 0}
.demo .wrap{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.demo input,.demo button{font:inherit;font-size:12px;padding:3px 8px;border-radius:4px;border:1px solid var(--bg);background:transparent;color:var(--bg)}
.demo b{color:var(--yellow);letter-spacing:.08em}

header.top{position:relative;border-bottom:2px solid var(--ink)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.03em;text-decoration:none}
.brand small{font-weight:400;font-size:13px;letter-spacing:.04em;margin-left:8px;color:var(--muted)}
.nav{display:flex;gap:8px;align-items:center}
.pill{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;display:inline-block}
.pill:hover{background:var(--ink);color:var(--bg)}

.hero{padding:34px 0 18px}
.hero h1{font-size:clamp(40px,8vw,92px);line-height:.92;letter-spacing:-.045em;margin:6px 0 10px;text-transform:uppercase}
.hero h1 span{color:var(--red)}
.hero p{max-width:660px;font-size:18px;margin:0 0 6px}
.today-tag{display:inline-block;background:var(--red);color:#fff;padding:4px 10px;border-radius:4px;transform:rotate(-2deg)}

.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.chiprow .lbl{min-width:84px;color:var(--muted)}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;gap:8px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip em{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:0 7px;font-size:11px}
.chip.zero{opacity:.45}
.chip .cdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);background:var(--c)}

section.block{padding:26px 0}
h2.sec{font-size:clamp(26px,4vw,40px);letter-spacing:-.035em;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px;max-width:700px}
.grid{display:grid;gap:14px}
.grid.cols{grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.gh{margin:24px 0 10px;font-size:22px;letter-spacing:-.03em}

.card{background:var(--surface);border:2px solid var(--ink);border-radius:14px;overflow:hidden;position:relative;text-align:left;width:100%;display:block;text-decoration:none;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--ink)}
.card .thumb{position:relative;aspect-ratio:4/3;background:var(--line);overflow:hidden;border-bottom:2px solid var(--ink)}
.card .thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .4s}
.card:hover .thumb img{transform:scale(1.04)}
.card .thumb .badge{position:absolute;left:10px;top:10px}
.card .cbody{padding:14px 16px 16px}
.card h3{margin:6px 0 4px;font-size:21px;letter-spacing:-.025em;line-height:1.1}
.card .meta{color:var(--muted);font-size:14px}
.badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;border-radius:4px;padding:3px 8px;font-weight:700;border:1.5px solid var(--ink)}
.b-hoy{background:var(--red);color:#fff;animation:pulse 1.6s infinite}
.b-manana{background:var(--yellow);color:#232322}
.b-semana{background:var(--blue);color:#fff}
.b-mes{background:var(--sky);color:#232322}
.b-ano{background:var(--surface);color:var(--ink)}
.b-curso{background:var(--lime);color:#232322}
.b-archivo{background:transparent;color:var(--muted);border-color:var(--muted)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(250,39,19,.55)}50%{box-shadow:0 0 0 7px rgba(250,39,19,0)}}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cat,.fmt{display:inline-flex;gap:6px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1.5px solid var(--ink)}
.cat{background:var(--c);color:#232322}
.cat i{font-style:normal;opacity:.7;cursor:help}
.fmt{background:transparent;color:var(--ink)}
.zdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;border:1.5px solid var(--ink)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.score{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.04em}
.meter{height:8px;flex:1;background:var(--line);border-radius:99px;overflow:hidden;max-width:120px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--red));border-radius:99px;transition:width .6s ease}
.empty{border:2px dashed var(--muted);border-radius:14px;padding:22px;color:var(--muted)}

.mapbox{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start}
.map{background:var(--map);border:2px solid var(--ink);border-radius:18px;overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto;touch-action:manipulation}
.zone{cursor:pointer;transition:opacity .25s,filter .25s}
.zone:hover{filter:brightness(1.07)}
.zone:focus-visible{outline:none}
.zone:focus-visible .zfill{stroke:var(--blue)}
.zone.dim{opacity:.3}
.zlabel{font-family:var(--sans);font-size:14px;font-weight:700;text-transform:uppercase;pointer-events:none;letter-spacing:.07em}
.zcount{pointer-events:none}
.zone.sel .zlabel,.zone.sel .zcount{opacity:0}
.mtnlbl{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;fill:var(--mtntxt)}
.riverlbl{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;fill:var(--river)}
.pin{cursor:pointer;transition:transform .2s}
.pin:hover{transform:scale(1.12)}
.pin text{font-family:var(--sans);font-size:9.5px;font-weight:700;paint-order:stroke;stroke:var(--map);stroke-width:3.2px;fill:var(--ink)}
.pin.pop{animation:pinDrop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pinDrop{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}
.mapchip{position:absolute;left:12px;top:12px;display:none;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:5px 12px 5px 6px;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;box-shadow:3px 3px 0 var(--ink)}
.mapchip.on{display:inline-flex;animation:pinDrop .4s both}
.mapchip b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#232322;color:#fff;font-size:13px}
.maphint{display:block;background:var(--surface);border-top:2px solid var(--ink);padding:6px 12px;color:var(--muted);font-size:12px}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:18px;padding:18px;min-height:320px}
.panel h3{margin:6px 0 6px;font-size:30px;letter-spacing:-.04em;line-height:1}
.zname{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;border:1.5px solid var(--ink)}
.list{list-style:none;margin:12px 0;padding:0;display:grid;gap:8px}
.list a,.list button{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:transparent;border-radius:10px;padding:10px 12px;text-decoration:none}
.list a:hover,.list button:hover{border-color:var(--ink)}
.note{font-size:13px;color:var(--muted)}
.inferred{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}

.crumb{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:20px 0 8px}
.crumb a{text-decoration:underline}
.profile-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:8px}
.profile-head h1{font-size:clamp(34px,6vw,64px);letter-spacing:-.045em;line-height:.95;margin:6px 0}
.facts{display:grid;gap:6px;font-size:15px;margin:10px 0}
.facts b{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);display:inline-block;min-width:110px}
.btn{border:2px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--bg);padding:10px 20px;font-size:13px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;text-decoration:none;display:inline-block}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.alt{background:transparent;color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:16px;padding:14px 26px;background:var(--red);border-color:var(--red);color:#fff;animation:wiggle 3s ease-in-out infinite}
.btn.big:hover{background:var(--ink);border-color:var(--ink)}
@keyframes wiggle{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-2.5deg)}96%{transform:rotate(2.5deg)}}
.cols2{display:grid;grid-template-columns:1.25fr .75fr;gap:24px;align-items:start}
.video{aspect-ratio:16/9;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--surface),var(--surface) 12px,var(--bg) 12px,var(--bg) 24px);display:grid;place-items:center;text-align:center;padding:16px}
.video iframe{width:100%;height:100%;border:0}
figure.flyer{margin:0 0 16px;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--surface)}
figure.flyer img{display:block;width:100%;height:auto}
figure.flyer figcaption{padding:8px 12px;font-size:12px;color:var(--muted);border-top:2px solid var(--ink)}
.rating-box{background:var(--surface);border:2px solid var(--ink);border-radius:14px;padding:16px}
.big-score{font-size:60px;font-weight:700;letter-spacing:-.05em;line-height:1}
.stars{color:var(--yellow);letter-spacing:2px;font-size:20px;-webkit-text-stroke:1px var(--ink)}
.comment{border-top:1px solid var(--line);padding:12px 0}
.comment small{font-weight:700;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}

.overlay{position:fixed;inset:0;background:rgba(23,23,22,.72);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:14px;z-index:50;overflow:auto}
.overlay.open{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--cream);color:#232322;border:3px solid #232322;border-radius:22px;width:min(520px,100%);padding:26px 22px 22px;position:relative;box-shadow:10px 10px 0 var(--red);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.7) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.stamp{position:absolute;top:-22px;right:18px;background:var(--red);color:#fff;border:3px solid #232322;border-radius:999px;padding:8px 16px;font-weight:700;letter-spacing:.08em;font-size:13px;transform:rotate(8deg);animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:rotate(4deg) translateY(-4px)}}
.modal h2{margin:14px 0 2px;font-size:30px;letter-spacing:-.04em;line-height:1}
.modal p.lead{margin:4px 0 14px;color:#4a4a45}
.x{position:absolute;left:14px;top:10px;border:0;background:transparent;font-size:26px;line-height:1;color:#232322}
.field{margin:12px 0}
.field label,.field legend{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px;font-weight:700;padding:0}
.field input[type=text],.field input[type=email],.field input[type=tel],.field textarea{width:100%;border:2px solid #232322;border-radius:10px;background:#fff;padding:11px 12px;font:inherit;font-size:16px;color:#232322}
.field textarea{min-height:84px;resize:vertical}
.field .err{display:none;color:#B3170A;font-size:13px;margin-top:4px;font-weight:700}
.field.bad .err{display:block}
.field.bad input,.field.bad textarea{border-color:#B3170A;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.seg{display:flex;gap:8px}
.seg label{flex:1;margin:0;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;border:2px solid #232322;border-radius:10px;padding:9px;background:#fff;font-weight:700;letter-spacing:.06em;font-size:13px;text-transform:uppercase}
.seg input:checked+span{background:#232322;color:#fff}
.seg input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.starpick{display:flex;gap:4px;justify-content:center}
.starpick input{position:absolute;opacity:0;pointer-events:none}
.starpick label{margin:0;font-size:44px;line-height:1;cursor:pointer;color:#fff;-webkit-text-stroke:2px #232322;transition:transform .15s,color .15s}
.starpick label:hover{transform:scale(1.25) rotate(-8deg)}
.starpick label.on{color:var(--yellow)}
.starpick input:focus-visible+label{outline:3px solid var(--blue);border-radius:6px}
.starword{text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;min-height:16px;margin-top:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.consent input{margin-top:3px;width:18px;height:18px;accent-color:#232322}
.send{width:100%;margin-top:8px;border:3px solid #232322;background:var(--red);color:#fff;border-radius:14px;padding:14px;font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;box-shadow:0 5px 0 #232322;transition:transform .1s,box-shadow .1s}
.send:hover{transform:translateY(2px);box-shadow:0 3px 0 #232322}
.send:active{transform:translateY(5px);box-shadow:0 0 0 #232322}
.thanks{display:none;text-align:center;padding:10px 0}
.thanks.show{display:block}
.thanks .tick{width:92px;height:92px;margin:6px auto 10px;border-radius:50%;background:var(--lime);border:3px solid #232322;display:grid;place-items:center;font-size:52px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:22px}
.confetti i{position:absolute;top:-14px;width:9px;height:14px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
footer{border-top:2px solid var(--ink);margin-top:40px;padding:22px 0 50px;color:var(--muted);font-size:14px}
.pill.icon{padding:7px 10px;display:inline-grid;place-items:center;line-height:0}
.pill.icon svg{width:20px;height:20px}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.activef{display:flex;gap:6px;flex-wrap:wrap}
.activef .chip{padding:4px 10px;font-size:11px}
.filters{display:none;border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:6px 14px 12px;margin:8px 0 14px}
.filters.open{display:block;animation:pinDrop .25s both}
.sharebar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.sbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;background:transparent;cursor:pointer;color:var(--ink)}
.sbtn:hover{background:var(--ink);color:var(--bg)}
.sbtn.wa{background:#25D366;color:#232322;border-color:#232322}
.sbtn.wa:hover{background:#232322;color:#25D366}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photos img{width:64px;height:64px;object-fit:cover;border:2px solid #232322;border-radius:8px}
.cthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cthumbs img{width:84px;height:84px;object-fit:cover;border:2px solid var(--ink);border-radius:8px}
.field .opt{font-weight:400;opacity:.65;text-transform:none;letter-spacing:0}
.field select,.field input[type=url],.field input[type=file]{width:100%;border:2px solid #232322;border-radius:10px;background:#fff;padding:10px 12px;font:inherit;font-size:16px;color:#232322}
.abarca{background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:10px 12px;margin:10px 0}
.more{background:none;border:0;padding:0;text-decoration:underline;font-weight:700;color:inherit}
.ast{font-weight:700;color:var(--red)}
.modal .btn.alt,.modal .sbtn{color:#232322;border-color:#232322}
.modal .btn.alt:hover,.modal .sbtn:hover{background:#232322;color:#FFE7CF}
.modal .sbtn.wa{background:#25D366}
.modal .sbtn.wa:hover{background:#232322;color:#25D366}
.modal.sug{box-shadow:10px 10px 0 var(--blue)}
.modal.sug .stamp{background:var(--blue)}
@media (max-width:820px){
  .mapbox,.cols2,.profile-head{grid-template-columns:1fr}
  .panel{min-height:0}
  .chiprow .lbl{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

[hidden]{display:none!important}
.demo b{letter-spacing:.08em}
.pill.icon{padding:7px 10px;display:inline-grid;place-items:center;line-height:0}
.pill.icon svg{width:20px;height:20px}
#langBtn{min-width:46px}

/* volver y acciones */
.backbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:999px;background:transparent;padding:7px 16px 7px 12px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin:18px 0 0}
.backbtn:hover{background:var(--ink);color:var(--bg)}
.backbtn svg{width:16px;height:16px}

/* tarjetas anchas (un solo evento) */
.card.wide{display:grid;grid-template-columns:minmax(220px,38%) 1fr}

/* página de evento */
.evpage{display:grid;grid-template-columns:minmax(260px,.95fr) 1.05fr;gap:28px;align-items:start;margin-top:18px}

.gal .main{position:relative;display:block;width:100%;padding:0;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:var(--line);cursor:zoom-in}

.gal .main .zoom{position:absolute;right:10px;bottom:10px;display:inline-flex;gap:6px;align-items:center;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}

.gal .thumbs button{width:64px;height:64px;padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);cursor:pointer}

/* lightbox */
.lb{position:fixed;inset:0;z-index:80;background:rgba(10,10,9,.97);display:grid;grid-template-columns:64px 1fr 64px;grid-template-rows:auto 1fr;align-items:center}

.lbtop{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;color:#F5F1F1}
.lbcount{font-size:13px;font-weight:700;letter-spacing:.08em}
.lbtools{display:flex;gap:8px}
.lbbtn{border:2px solid #F5F1F1;background:transparent;color:#F5F1F1;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lbbtn:hover{background:#F5F1F1;color:#171716}
.lbfig{margin:0;display:grid;gap:8px;justify-items:center;align-self:stretch;min-height:0;padding:0 0 12px}
.lbfig img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:6px}

/* mapa v4 */
.map svg{background:var(--map)}
.zone .zfill{stroke:#232322;stroke-width:2.2;stroke-linejoin:round;filter:url(#wob)}
.zone .zroad{fill:none;stroke:#fff;stroke-opacity:.7;stroke-width:3;stroke-linecap:round}
.zone .zart{pointer-events:none}
.zrib rect{stroke:#232322;stroke-width:2}
.zone.sel .zrib,.zone.sel .zcount{opacity:0}
.zone.sel .zart{opacity:.4}
.zlabel{font-family:var(--sans);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;pointer-events:none}
.mtn path.base{stroke:#232322;stroke-width:2;stroke-linejoin:round;filter:url(#wob)}
.mtn .hatch{stroke:#232322;stroke-width:1;opacity:.5}
.mtnlbl{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;fill:var(--mtntxt);paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.riverlbl{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;fill:#14394a;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
:root[data-theme="dark"] .riverlbl{fill:#d9f0fa;stroke:#14394a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .riverlbl{fill:#d9f0fa;stroke:#14394a}}
.sant{fill:none;stroke:#232322;stroke-width:1.6;stroke-dasharray:5 4}
.santlbl{font-family:var(--sans);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;fill:#232322;paint-order:stroke;stroke:rgba(255,255,255,.7);stroke-width:2.5px}
.pin text{font-size:9px}
.compass text{font-family:var(--sans);font-size:10px;font-weight:700;fill:var(--ink)}

/* visitantes y comunidad */
.vchips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 16px}
.vcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.vcard{border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:14px 16px;display:grid;gap:6px}
.vcard h4{margin:0;font-size:19px;letter-spacing:-.02em;line-height:1.1}
.vcard .row{display:flex;gap:8px;flex-wrap:wrap}
.reclist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:14px}
.recitem{border:2px solid var(--ink);border-radius:14px;background:var(--surface);padding:14px 16px}
.recitem h4{margin:0 0 4px;font-size:18px}
.recitem p{margin:6px 0 0}
.modal.rec{box-shadow:10px 10px 0 var(--violet)}
.modal.rec .stamp{background:var(--violet)}
.revlist .comment:first-child{border-top:0}

@media (max-width:820px){
  .evpage{grid-template-columns:1fr}
  .evmedia{position:static}
  .card.wide{grid-template-columns:1fr}
  .card.wide .thumb{aspect-ratio:4/3;border-right:0;border-bottom:2px solid var(--ink)}
  .lb{grid-template-columns:44px 1fr 44px}
  .lbnav{width:38px;height:38px;font-size:30px}
}

/* Menú de cucoarts.com para la página pública /mty. Mismo contenido y mismo comportamiento que SiteMenu.tsx de la landing. */
.cl-menubtn{display:inline-flex;align-items:center;gap:10px;font:700 12px "Courier New",Courier,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--bg);background:var(--ink);
  border:2px solid var(--ink);border-radius:999px;padding:7px 15px 7px 13px;cursor:pointer;position:relative;transition:background .2s,color .2s,translate .15s,box-shadow .15s;box-shadow:3px 3px 0 #EA663D}

.cl-menuicon i:nth-child(2){top:5.75px;width:70%}

<script>
/* ============ ZONAS (las 5 de "Zonas Culturales"; Santiago, N.L. va dentro del Sur, con asterisco) ============ */
/* "abarca" lo definió Roberto el 26-oct-2026. "poetico" e "iconos" vienen del documento de Drive "Zonas Culturales" (jun 2026). */
const ZONES = {
  centro:  {nombre:'Centro', nombre_en:'Downtown', corto:'Centro', corto_en:'Downtown', color:'--z-centro', on:'--on-centro',
            poly:'232,182 300,176 342,198 346,248 322,282 262,288 222,262 216,218', rib:[281,160],
            abarca:'Monterrey, el primer cuadro de la ciudad: desde Gonzalitos hasta la Y Griega, y hasta Ruiz Cortines al norte. Al sur, hasta el Río Santa Catarina.',
            abarca_en:"Monterrey's first quarter, the old downtown: from Gonzalitos to the Y Griega, and up to Ruiz Cortines to the north. To the south, it reaches the Santa Catarina River.",
            iconos:'Calle Morelos, Barrio Antiguo, Macroplaza (Explanada de los Héroes, el Tritón), 3 Museos, Palomita y MARCO, Riverwalk Santa Lucía',
            iconos_en:'Morelos Street, Barrio Antiguo, Macroplaza (Explanada de los Héroes, the Triton), 3 Museos, Palomita and MARCO, Santa Lucía Riverwalk',
            poetico:['El Centro de Monterrey es el lugar donde la escala gigante de la ciudad se vuelve humana y se camina a ras de suelo. Todo empieza en el Barrio Antiguo, que lejos de ser un museo viejo y estático, es el corazón bohemio y alternativo de la ciudad. Caminar por sus calles empedradas es encontrarte con cafecitos de especialidad, tiendas de vinilos, galerías de arte local y el clásico mercadito cultural de los domingos. Para cualquiera que venga de fuera, este es el punto de encuentro favorito porque es donde la historia de Monterrey conecta de forma muy natural con la música en vivo, la buena comida y el pulso creativo de nuestra gente.',
                     'A unos pasos de ahí te topas con la Macroplaza, ese espacio enorme donde la rutina diaria de los regios se cruza con la vista imponente de nuestras montañas. De este gran eje nace el Paseo Santa Lucía, un canal peatonal ideal para caminar sin prisa, rodeado de puentes, terrazas y piezas de arte público que te llevan a recorrer la ciudad en movimiento. Al final, la cultura del centro se define por esa mezcla: un territorio vivo donde puedes tomar un buen café en una casa antigua, respirar el asfalto de la plaza y ver cómo el diseño contemporáneo y la vida de barrio se conectan en el día a día.'],
            poetico_en:["Downtown Monterrey is where the city's giant scale becomes human and you walk at street level. It all starts in Barrio Antiguo, which, far from being an old static museum, is the bohemian, alternative heart of the city. Walking its cobblestone streets means running into specialty coffee shops, record stores, local art galleries and the classic Sunday cultural market. For anyone visiting from out of town, this is the favorite meeting point because it is where Monterrey's history connects, very naturally, with live music, good food and the creative pulse of our people.",
                        "A few steps away you run into the Macroplaza, a huge space where the everyday routine of the regios crosses paths with the imposing view of our mountains. From this great axis comes the Paseo Santa Lucía, a pedestrian canal ideal for walking without hurry, surrounded by bridges, terraces and pieces of public art that take you through the city on the move. In the end, downtown culture is defined by that mix: a living territory where you can have a good coffee in an old house, breathe the asphalt of the plaza and see how contemporary design and neighborhood life connect day to day."],
            artistas:['Mina Martins','Mizael Valero','Tankez77']},
  norte:   {nombre:'Norte', nombre_en:'North', corto:'Norte', corto_en:'North', color:'--z-norte', on:'--on-norte',
            poly:'210,52 330,36 450,44 520,84 510,130 440,150 350,140 280,152 215,142 195,100', rib:[360,62],
            abarca:'San Nicolás, Escobedo y Apodaca.', abarca_en:'San Nicolás, Escobedo and Apodaca.',
            iconos:'Plaza del centro de San Nicolás', iconos_en:'San Nicolás downtown plaza',
            poetico:['Si piensas en el Norte de la metrópoli, y especialmente en San Nicolás, lo primero que te viene a la mente podría ser la industria y las grandes avenidas. Pero cuando te clavas en el Centro de San Nico, la vibra cambia por completo y se vuelve súper vecinal, cercana y nostálgica. Su plaza principal es el punto de reunión por excelencia, un lugar que se siente como un respiro del ritmo acelerado de la ciudad. Aquí la cultura se vive en las cosas más simples: la gente que se junta a platicar en las bancas por las tardes, los niños corriendo y esa atmósfera de comunidad unida que cuida con mucho orgullo su identidad de barrio.',
                     'Lo rico de esta zona está en el día a día de sus calles y en sus negocios locales, esos de toda la vida que son parte del paisaje urbano. Desde ir por una nieve tradicional o unos elotes para pasar la tarde en la plaza, hasta platicar con los dueños de los comercios que le dan vida al centro. Para los creadores y fotógrafos que recorren el Norte, la inspiración no está en las grandes fábricas, sino en este rincón donde las tradiciones norteñas siguen vivas y donde la rutina de los vecinos se convierte en un retrato auténtico, cálido y muy hogareño de Monterrey.'],
            poetico_en:["If you think of the North of the metropolis, and especially San Nicolás, the first thing that comes to mind may be industry and big avenues. But once you dive into the center of San Nico, the vibe changes completely and becomes super neighborly, close and nostalgic. Its main plaza is the meeting point par excellence, a place that feels like a breather from the city's fast pace. Culture here is lived in the simplest things: people gathering to chat on the benches in the afternoons, kids running around and that atmosphere of a tight-knit community that proudly looks after its neighborhood identity.",
                        "What is rich about this area is in the day-to-day of its streets and its local businesses, the lifelong ones that are part of the urban landscape. From getting a traditional ice cream or some elotes to spend the afternoon in the plaza, to chatting with the owners of the shops that give life to the center. For the creators and photographers who walk the North, inspiration is not in the big factories but in this corner where northern traditions are still alive and where the neighbors' routine becomes an authentic, warm and very homey portrait of Monterrey."],
            artistas:['Chema Chapa','Darío Diario','Porras Visual','Romualdo Castañeda']},
  oriente: {nombre:'Oriente', nombre_en:'East', corto:'Oriente', corto_en:'East', color:'--z-oriente', on:'--on-oriente',
            poly:'372,162 450,158 530,170 575,215 580,282 545,322 470,326 405,300 372,258 362,205', rib:[470,196],
            abarca:'Guadalupe, parte de Apodaca y Juárez.', abarca_en:'Guadalupe, part of Apodaca and Juárez.',
            iconos:'Cerro de la Silla, Río La Silla, Plaza del centro de Guadalupe, iglesia, Estadio', iconos_en:'Cerro de la Silla, Río La Silla, Guadalupe downtown plaza, church, Stadium',
            poetico:['El Oriente, con Guadalupe al frente, tiene una personalidad entrañable donde la tradición del pueblo original se mezcla de forma muy natural con la pasión moderna. Aquí, el Cerro de la Silla muestra su cara más imponente y cercana, casi como un vecino más que custodia el día a día del vecindario. A sus faldas corre el Río La Silla, un pasillo verde y vivo que funciona como un oasis natural entre el asfalto, donde las familias se reúnen a caminar bajo la sombra de los árboles y a conectar con la naturaleza sin salir de la ciudad.',
                     'El alma de este sector se respira en la Plaza del Centro de Guadalupe y su histórica iglesia. Este espacio conserva esa bonita calma de plaza tradicional, donde las tardes se disfrutan sin prisa entre el antojo de unos churros recién hechos y las pláticas de la gente en las bancas. Pero el oriente también sabe vibrar con fuerza: a solo unos minutos de este núcleo histórico se levanta el monumental Estadio, un gigante de acero que congrega la pasión futbolera local y que este verano de 2026 pone a la zona bajo los ojos del mundo entero. Para quienes capturan la ciudad, Guadalupe regala una dualidad perfecta: la nostalgia de la vida de plaza frente a la energía de un coloso moderno, todo bajo la silueta más perfecta de nuestra montaña.'],
            poetico_en:["The East, with Guadalupe in front, has a lovable personality where the tradition of the original town mixes very naturally with modern passion. Here Cerro de la Silla shows its most imposing and closest face, almost like one more neighbor watching over the daily life of the neighborhood. At its foothills runs the Río La Silla, a green, living corridor that works as a natural oasis among the asphalt, where families gather to walk in the shade of the trees and connect with nature without leaving the city.",
                        "The soul of this area is felt in the Plaza del Centro de Guadalupe and its historic church. This space keeps that lovely calm of a traditional plaza, where afternoons are enjoyed without hurry between the craving for freshly made churros and the chats of people on the benches. But the east also knows how to vibrate strongly: just minutes from this historic core rises the monumental Stadium, a steel giant that gathers local football passion and that this summer of 2026 puts the area under the eyes of the whole world. For those who capture the city, Guadalupe offers a perfect duality: the nostalgia of plaza life against the energy of a modern colossus, all under the most perfect silhouette of our mountain."],
            artistas:['Eliezer Blanco','Frida Balderas']},
  sur:     {nombre:'Sur', nombre_en:'South', corto:'Sur', corto_en:'South', color:'--z-sur', on:'--on-sur',
            poly:'232,338 330,326 420,336 436,390 424,440 392,470 350,505 306,508 270,480 246,430 228,385', rib:[330,358],
            abarca:'Del río hacia abajo: todo lo que hay entre la sierra y el Cerro de la Silla, hasta Santiago, N.L.*', abarca_en:'From the river down: everything between the sierra and Cerro de la Silla, all the way to Santiago, N.L.*',
            nota:'* Santiago, N.L. está incluido dentro del Sur.', nota_en:'* Santiago, N.L. is included within the South.',
            iconos:'El Tec (Servilletero), Avionsito de Blvd. Acapulco', iconos_en:'The Tec (Servilletero), the Avionsito on Blvd. Acapulco',
            poetico:['El Sur de Monterrey tiene una vibra muy particular, como si lograra equilibrar el ritmo acelerado de la avenida Garza Sada justo a los pies del Cerro de la Silla. El gran motor de la zona es, sin duda, la comunidad del Tec de Monterrey, que inyecta un pulso joven, universitario y de constante movimiento a todo el sector. Caminar por estas calles te lleva a descubrir un paisaje donde el diseño de vanguardia convive con parques arbolados que regalan un respiro del calor, y esas cafeterías de rincón que se han vuelto los puntos de encuentro favoritos de los vecinos.',
                     'La verdadera sustancia de este sector está en las capas de historia que esconde su paisaje urbano. Hacia arriba, trepando por las faldas de la montaña, la silueta inconfundible de la “Casa de los Tubos” despierta mitos y curiosidad arquitectónica en cualquiera. Mientras tanto, metiéndote hacia los vecindarios por el Boulevard Acapulco, el Parque Las Brisas resguarda un rincón de memoria nacional: la réplica del famoso “Avionsito”. Lejos de ser solo un punto de referencia visual, este monumento rinde homenaje al legendario Escuadrón 201, el grupo de soldados mexicanos que pelearon en la Segunda Guerra Mundial. Para los fotógrafos y artistas plásticos, el sur se convierte así en un mapa fascinante donde la energía estudiantil, las leyendas urbanas y el orgullo histórico conviven diariamente bajo la sombra de nuestra silueta más icónica.'],
            poetico_en:["Monterrey's South has a very particular vibe, as if it managed to balance the fast pace of Garza Sada avenue right at the feet of Cerro de la Silla. The great engine of the area is, without a doubt, the Tec de Monterrey community, which injects a young, university and constantly moving pulse into the whole sector. Walking these streets leads you to discover a landscape where cutting-edge design coexists with leafy parks that offer a break from the heat, and those corner cafés that have become the neighbors' favorite meeting points.",
                        "The true substance of this sector lies in the layers of history hidden in its urban landscape. Up on the mountain's slopes, the unmistakable silhouette of the “Casa de los Tubos” stirs myths and architectural curiosity in anyone. Meanwhile, heading into the neighborhoods along Boulevard Acapulco, Parque Las Brisas safeguards a corner of national memory: the replica of the famous “Avionsito”. Far from being just a visual landmark, this monument pays homage to the legendary Squadron 201, the group of Mexican soldiers who fought in World War II. For photographers and visual artists, the south thus becomes a fascinating map where student energy, urban legends and historical pride coexist daily under the shadow of our most iconic silhouette."],
            artistas:['Greometría']},
  poniente:{nombre:'Poniente', nombre_en:'West', corto:'Poniente', corto_en:'West', color:'--z-poniente', on:'--on-poniente',
            poly:'20,168 100,150 175,168 200,215 205,270 190,318 140,338 70,330 24,285 10,225', rib:[110,134],
            abarca:'San Pedro, Santa Catarina y Cumbres Mty.', abarca_en:'San Pedro, Santa Catarina and Cumbres Mty.',
            iconos:'La M (Sierra Madre), La Huasteca, Las Mitras, Parques, Centro Cultural Plaza Fátima y Parroquia y Santuario de Nuestra Señora de Fátima', iconos_en:'La M (Sierra Madre), La Huasteca, Las Mitras, parks, Centro Cultural Plaza Fátima and the Parish and Sanctuary of Our Lady of Fátima',
            poetico:['El Poniente tiene un pulso muy particular, donde la vida urbana se acomoda entre algunas de las siluetas naturales más imponentes de la región. En San Pedro, la escala del día a día la dictan las montañas: habitar este sector es vivir rodeado por el abrazo de “La M” en la Sierra Madre, la majestuosidad rocosa de La Huasteca y la vista siempre presente de Las Mitras justo en frente. Ese contacto tan directo con el paisaje ha moldeado una subcultura muy conectada con el aire libre, reflejada en sus parques, que funcionan como los verdaderos patios comunes de los vecinos.',
                     'El ritual que mejor define la convivencia de la zona ocurre los domingos por la mañana sobre la Calzada Vasconcelos con San Pedro de Pinta. Es el momento de la semana donde el asfalto deja ir a los autos para transformarse en un andador vivo, lleno de mercados locales, caminatas sin prisa y propuestas creativas de calle.',
                     'Muy cerca de este corredor peatonal, la identidad cultural del barrio encuentra su refugio en un cruce icónico: la arquitectura de la Parroquia y Santuario de Nuestra Señora de Fátima, que convive pared con pared con el Centro Cultural Plaza Fátima. Este punto se ha vuelto un punto de referencia para la comunidad, uniendo la tradición vecinal con galerías que siempre están impulsando el arte contemporáneo. Para los fotógrafos y artistas plásticos, el poniente regala una atmósfera de líneas limpias, luz brillante y una geografía dramática que reta constantemente la perspectiva del paisaje norteño.'],
            poetico_en:["The West has a very particular pulse, where urban life settles among some of the most imposing natural silhouettes in the region. In San Pedro, the scale of everyday life is dictated by the mountains: living here means being surrounded by the embrace of “La M” in the Sierra Madre, the rocky majesty of La Huasteca and the ever-present view of Las Mitras right in front. That direct contact with the landscape has shaped a subculture closely tied to the outdoors, reflected in its parks, which work as the neighbors' true shared patios.",
                        "The ritual that best defines the area's togetherness happens on Sunday mornings on Calzada Vasconcelos with San Pedro de Pinta. It is the moment of the week when the asphalt lets the cars go and turns into a living walkway, full of local markets, unhurried walks and creative street proposals.",
                        "Very close to this pedestrian corridor, the neighborhood's cultural identity finds its refuge at an iconic crossing: the architecture of the Parish and Sanctuary of Our Lady of Fátima, which sits wall to wall with the Centro Cultural Plaza Fátima. This spot has become a reference point for the community, joining neighborhood tradition with galleries that are always pushing contemporary art. For photographers and visual artists, the west offers an atmosphere of clean lines, bright light and a dramatic geography that constantly challenges the perspective of the northern landscape."],

/* estado temporal del evento */
function estado(ev){
  const t0=today(), s=parse(ev.inicio), f=ev.fin?parse(ev.fin):null;
  const diff=Math.round((s-t0)/DAY);
  if(diff>0){
    if(diff===1)return {k:'manana',orden:1};
    if(diff<=6)return {k:'semana',orden:2};
    if(s.getFullYear()===t0.getFullYear()&&s.getMonth()===t0.getMonth())return {k:'mes',orden:3};
    if(s.getFullYear()===t0.getFullYear())return {k:'ano',orden:4};
    return {k:'mas',orden:5};
  }
  if(diff===0)return {k:'hoy',orden:0};
  if(f?t0<=f:ev.finIncierto)return {k:'curso',orden:1.5};
  return {k:'archivo',orden:9};
}
const BCLASS={hoy:'b-hoy',manana:'b-manana',semana:'b-semana',mes:'b-mes',ano:'b-ano',mas:'b-ano',curso:'b-curso',archivo:'b-archivo'};

const MEM={'mty-checkins':[],'mty-reco':[],'mty-sugerencias':[]};
function loadK(k){try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return MEM[k]}}

const loadCI=()=>loadK('mty-checkins'), saveCI=a=>saveK('mty-checkins',a);

const okPub=x=>x.estado!=='pendiente';
const socialUrl=v=>{v=(v||'').trim();if(!v)return '';if(/^https?:\/\//i.test(v))return v;if(/^@?[\w.]{2,30}$/.test(v))return 'https://www.instagram.com/'+v.replace(/^@/,'')+'/';return ''};
const socialLabel=v=>{v=(v||'').trim();if(/^@?[\w.]{2,30}$/.test(v))return '@'+v.replace(/^@/,'');return v.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').slice(0,34)};
/* Sin calificaciones se muestra el símbolo de asterisco sobre 5; con la primera, el promedio es el de las calificaciones reales. */
function rating(kind,id){
  const cis=loadCI().filter(c=>c.tipo===kind&&c.ref===id&&okPub(c));
  const n=cis.length, suma=cis.reduce((a,c)=>a+c.estrellas,0);

}
function countLabel(kind,n){return n+' '+(kind==='evento'?(n>1?t('ci_many'):t('ci_one')):(n>1?t('rec_many'):t('rec_one')))}

  if(RO)return '';

  if(!r.n)return `<div class="score"><span class="star0">*/5</span><span class="meter"><i style="width:0"></i></span><span>${esc(t('be_first_short'))}</span></div>`;
  return `<div class="score"><span>★ ${r.prom.toFixed(1)}</span><span class="meter"><i style="width:${r.prom/5*100}%"></i></span><span>${esc(countLabel(kind,r.n))}</span></div>`;

function commentHTML(c){
  const name=esc(c.alias||t('visitor'));
  const link=c.link&&/^https?:\/\//.test(c.link)?`<p style="margin:4px 0 0"><a class="more" href="${esc(c.link)}" target="_blank" rel="noopener nofollow">${esc(t('see_post'))}</a></p>`:'';
  const su=socialUrl(c.social);
  const cred=su?` · <a class="more" href="${esc(su)}" target="_blank" rel="noopener nofollow">${esc(socialLabel(c.social))}</a>`:'';
  return `<div class="comment"><span class="stars">${'★'.repeat(c.estrellas)}${'☆'.repeat(5-c.estrellas)}</span> <small>${name}${cred} · ${fmtShort(c.fecha)}</small><p style="margin:4px 0 0">${esc(c.comentario)}</p>${link}</div>`;
}

function calUrl(ev){
  const t0=today(), s=parse(ev.inicio), up=s>=t0, c=ev.cal||{todoDia:true};
  const day=up?s:t0, ymd=day.getFullYear()+pad2(day.getMonth()+1)+pad2(day.getDate());
  let dates;
  if(!c.h||(!up&&c.todoDia)||(up&&c.todoDia&&!c.h)){
    const n=new Date(day.getTime()+DAY); dates=ymd+'/'+n.getFullYear()+pad2(n.getMonth()+1)+pad2(n.getDate());
  }else{
    const [hh,mm]=c.h.split(':').map(Number); const a=new Date(day.getFullYear(),day.getMonth(),day.getDate(),hh,mm); const b=new Date(a.getTime()+(c.min||90)*60000);
    const f=d=>d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
    dates=f(a)+'/'+f(b);
  }
  const p=PLACES[ev.lugar];
  const det=L(ev,'detalle')+'\n\n'+(ev.post?ev.post+'\n':'')+'CUCO ARTS /mty';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(eT(ev))+'&dates='+dates+'&ctz=America%2FMonterrey&details='+encodeURIComponent(det)+'&location='+encodeURIComponent(pN(p)+(p.dir?', '+L(p,'dir'):''));
}

let vbAnim=null;
function zoomTo(vb){
  const svg=$('#mapSvg');if(!svg)return;
  const cur=svg.getAttribute('viewBox').split(' ').map(Number);
  cancelAnimationFrame(vbAnim);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){svg.setAttribute('viewBox',vb.join(' '));return;}
  const t0=performance.now(),d=450;
  const step=tt=>{const k=Math.min(1,(tt-t0)/d),e=1-Math.pow(1-k,3);
    svg.setAttribute('viewBox',cur.map((c,i)=>c+(vb[i]-c)*e).join(' '));
    if(k<1)vbAnim=requestAnimationFrame(step)};
  vbAnim=requestAnimationFrame(step);
}
function evCount(id){return EVENTS.filter(e=>e.lugar===id&&estado(e).k!=='archivo').length}

/* colocación de etiquetas sin encimarse */
function layoutLabels(list){
  const placed=[], pinRects=list.map(([id,p])=>({id,r:[p.pin[0]-9,p.pin[0]+9,p.pin[1]-27,p.pin[1]]}));
  const hit=(a,b)=>!(a[1]<b[0]||b[1]<a[0]||a[3]<b[2]||b[3]<a[2]);
  const out={};
  list.slice().sort((a,b)=>a[1].pin[1]-b[1].pin[1]||a[1].pin[0]-b[1].pin[0]).forEach(([id,p])=>{
    const txt=pC(p)+(p.santiago?'*':''), w=txt.length*5.3+4;
    const cands=[]; [0,11,-11,22,-22,33].forEach(dy=>{cands.push({x:p.pin[0]+11,a:'start',dy});cands.push({x:p.pin[0]-11,a:'end',dy})});
    let best=null;
    for(const c of cands){
      const y=p.pin[1]-14+c.dy, r=c.a==='start'?[c.x,c.x+w,y-9,y+2]:[c.x-w,c.x,y-9,y+2];
      if(!placed.some(q=>hit(r,q))&&!pinRects.some(q=>q.id!==id&&hit(r,q.r))){best={x:c.x,y,a:c.a,r};break}
    }
    if(!best){const c=cands[0],y=p.pin[1]-14;best={x:c.x,y,a:c.a,r:[c.x,c.x+w,y-9,y+2]}}
    placed.push(best.r); out[id]=best;
  });
  return out;
}

      <p>${esc(t('zones_intro_t'))}</p>

  $$('.pin',pins).forEach(g=>{const go=()=>{go2('#/lugar/'+g.dataset.p)};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter')go()}});
  panel.innerHTML=`<button class="pill" type="button" id="zBack" style="margin-bottom:10px">${esc(t('all_zones'))}</button><br>

const GROUPS=[['hoy','g_today'],['manana','g_tomorrow'],['semana','g_week'],['curso','g_curso'],['mes','g_month'],['ano','g_year'],['archivo','g_archive']];
function inMonth(ev,ym){
  const t0=today(), cur=t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0');
  const s=ev.inicio.slice(0,7); let e=(ev.fin||ev.inicio).slice(0,7);
  if(!ev.fin&&ev.finIncierto&&cur>e)e=cur;
  return ym>=s&&ym<=e;
}
function monthList(){
  const t0=today(), set=new Set();
  EVENTS.forEach(ev=>{if(estado(ev).k=='archivo')return;let [y,m]=ev.inicio.slice(0,7).split('-').map(Number);const end=(ev.fin||ev.inicio).slice(0,7);for(let i=0;i<24;i++){const k=y+'-'+String(m).padStart(2,'0');if(k>end)break;set.add(k);m++;if(m>12){m=1;y++}}});
  const cur=t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0');
  return [...set].filter(k=>k>=cur).sort();
}
function monthLabel(ym){const [y,m]=ym.split('-').map(Number);return L({a:MESES_L.es[m-1],a_en:MESES_L.en[m-1]},'a')+(y!==today().getFullYear()?' '+y:'')}
function matches(ev,o){
  const k=estado(ev).k;
  if(k==='archivo'&&o.date!=='archivo')return false;
  if(o.date==='archivo'&&k!=='archivo')return false;
  if(o.zone&&PLACES[ev.lugar].zona!==o.zone)return false;
  if(o.cat&&o.cat!=='todas'&&ev.cat!==o.cat)return false;
  if(o.mes&&!inMonth(ev,o.mes))return false;
  if(o.date&&o.date!=='todos'){const kk=(k==='mas'?'ano':k);if(kk!==o.date)return false}
  return true;
}

const lbEl=$('#lb'); let lb={ev:null,i:0};
/* tamaño dinámico: lo más grande posible dentro de la ventana, sin pasar de 1.8 veces el tamaño real de la imagen */
function lbFit(){
  const im=$('#lbImg'); if(!im.naturalWidth)return;
  const vw=innerWidth-(innerWidth<820?100:170), vh=innerHeight-150;
  const k=Math.min(vw/im.naturalWidth,vh/im.naturalHeight,1.8);
  im.style.width=Math.round(im.naturalWidth*k)+'px'; im.style.height=Math.round(im.naturalHeight*k)+'px';
}
$('#lbImg').addEventListener('load',lbFit);
window.addEventListener('resize',()=>{if(!lbEl.hidden)lbFit()});
function lbShow(){
  const imgs=lb.ev.imgs, n=imgs.length;
  const im=$('#lbImg'); im.style.width=''; im.style.height='';
  im.src=imgs[lb.i]; im.alt=eT(lb.ev); if(im.complete)lbFit();
  $('#lbCount').textContent=(lb.i+1)+' / '+n; $('#lbCap').textContent=L(lb.ev,'credito');
  $('#lbPrev').hidden=n<2; $('#lbNext').hidden=n<2; $('#lbPrev').disabled=lb.i===0; $('#lbNext').disabled=lb.i===n-1; $('#lbFirst').hidden=n<2||lb.i===0;
}
function openLB(ev,i){lb={ev,i};lbEl.hidden=false;document.body.style.overflow='hidden';lbShow();$('#lbClose').focus()}
function closeLB(){
  lbEl.hidden=true;document.body.style.overflow='';
  galIdx=lb.i; const gi=$('#galImg'); if(gi&&lb.ev)gi.src=lb.ev.imgs[galIdx];
  $$('#galThumbs button').forEach((b,k)=>b.setAttribute('aria-current',k===galIdx));
}
function lbGo(d){const n=lb.ev.imgs.length;const j=Math.max(0,Math.min(n-1,lb.i+d));if(j!==lb.i){lb.i=j;lbShow()}}
$('#lbPrev').onclick=()=>lbGo(-1); $('#lbNext').onclick=()=>lbGo(1);
$('#lbFirst').onclick=()=>{lb.i=0;lbShow()}; $('#lbClose').onclick=closeLB;
lbEl.addEventListener('mousedown',e=>{if(e.target===lbEl)closeLB()});
let tx0=null;
lbEl.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
lbEl.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)},{passive:true});

/* teclado y menús */
document.addEventListener('keydown',e=>{
  if(!lbEl.hidden){
    if(e.key==='Escape')closeLB(); else if(e.key==='ArrowRight')lbGo(1); else if(e.key==='ArrowLeft')lbGo(-1); else if(e.key==='Home'){lb.i=0;lbShow()}
    return;
  }
  if(e.key==='Escape'){
    if(recOverlay.classList.contains('open'))return closeRec();
    if(sugOverlay.classList.contains('open'))return closeSug();
    if(overlay.classList.contains('open'))return closeModal();
    const m=$('#shareMenu'); if(m&&!m.hidden){m.hidden=true;$('#shareBtn').setAttribute('aria-expanded','false')}
  }
  if(e.key==='Tab'&&overlay.classList.contains('open')){
    const f=$$('button,input,textarea,a[href]',$('#modal')).filter(x=>x.offsetParent!==null&&!x.disabled&&(x.type!=='radio'||x.checked));
    if(!f.length)return;const a=f[0],b=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();b.focus()}else if(!e.shiftKey&&document.activeElement===b){e.preventDefault();a.focus()}
  }
});
document.addEventListener('click',e=>{

function go2(h){
  if(h==='#mapa'||h==='#evsec'){anchorTo(h);return}
  if(h!==current)hist.push(current);
  current=h;
  try{history.pushState(null,'',h)}catch(e){}
  route();
}
function goBack(){
  current=hist.length?hist.pop():'#/';
  try{history.pushState(null,'',current)}catch(e){}
  route();
}
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a||e.defaultPrevented||e.ctrlKey||e.metaKey||e.shiftKey)return;
  const h=a.getAttribute('href');
  if(h.length>1){e.preventDefault();go2(h)}
});
window.addEventListener('hashchange',()=>{current=location.hash||'#/';route()});
window.addEventListener('popstate',()=>{current=location.hash||'#/';route()});

function viewZoneRoute(zk){
  if(!ZONES[zk])return notFound();
  selZone=zk; viewHome(); setTimeout(()=>{const m=$('#mapa'); if(m)m.scrollIntoView({behavior:'smooth'})},50);
}
function route(){
  const h=current||'#/';
  const [,a,b]=h.split('/');
  window.scrollTo(0,0);
  if(h==='#/'||h===''||h==='#')viewHome();
  else if(h==='#mapa'||h==='#evsec'){viewHome();anchorTo(h)}
  else if(a==='zona')viewZoneRoute(b);
  else if(a==='lugar')viewPlace(b);
  else if(a==='evento')viewEvent(b);
  else notFound();
}
refreshStatic();
route();

/* ============ MENÚ DE CUCOARTS.COM (solo en la página pública) ============ */
/* Mismas secciones, orden y etiquetas que SiteMenu.tsx de la landing. "Eventos" es esta página. */
(function(){
  if(!window.MTY_RO)return;
  const TXT={
    es:{menu:'Menú',close:'Cerrar menú',home:'Inicio',here:'estás aquí',label:'Menú principal',connect:'Escríbenos',store:'Tienda',murals:'Murales',art:'Arte por encargo',sell:'Vende tu obra',expo:'Expo en Santiago',events:'Eventos',fresh:'Nuevo',live:'Activa'},
    en:{menu:'Menu',close:'Close menu',home:'Home',here:'you are here',label:'Main menu',connect:'Write to us',store:'Store',murals:'Murals',art:'Custom art',sell:'Sell your art',expo:'Expo in Santiago',events:'Events',fresh:'New',live:'Live'}
  };
  const lp=(en,p)=>en?(p==='/'?'/en':'/en'+({'/murales':'/murals','/arte-por-encargo':'/custom-art'}[p]||p)):p;
  function items(){
    const en=LANG==='en', t=TXT[LANG];
    return [
      {id:'home',label:t.home,href:lp(en,'/')},
      {id:'store',label:t.store,href:'https://store.cucoarts.com',ext:true},
      {id:'murales',label:t.murals,href:lp(en,'/murales'),badge:t.fresh},
      {id:'arte',label:t.art,href:lp(en,'/arte-por-encargo'),badge:t.fresh},
      {id:'sell',label:t.sell,href:lp(en,'/')+'#vende'},
      {id:'husky',label:t.expo,href:lp(en,'/husky'),badge:t.live},
      {id:'events',label:t.events,href:'/mty',badge:t.fresh,current:true}
    ];
  }
  const nav=document.querySelector('.top .nav'); if(!nav)return;
  const btn=document.createElement('button'); btn.type='button'; btn.className='cl-menubtn'; btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-controls','site-menu');
  btn.innerHTML='<span class="cl-menuicon" aria-hidden="true"><i></i><i></i><i></i></span><span class="cl-menutxt"></span>';
  nav.appendChild(btn);
  const panel=document.createElement('div'); panel.id='site-menu'; panel.className='cl-menu'; panel.tabIndex=-1; panel.setAttribute('role','dialog'); panel.setAttribute('aria-modal','true'); panel.setAttribute('aria-hidden','true');
  document.body.appendChild(panel);
  let open=false, lastFocus=null, rt=null;
  const esc2=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function label(){btn.querySelector('.cl-menutxt').textContent=open?TXT[LANG].close:TXT[LANG].menu}
  function render(){
    const t=TXT[LANG];
    panel.setAttribute('aria-label',t.label);
    panel.innerHTML='<div class="cl-menu-in"><div class="cl-menu-top"><span class="cl-menu-logo" aria-hidden="true"></span><button type="button" class="cl-menu-x" aria-label="'+esc2(t.close)+'"><span aria-hidden="true">✕</span></button></div>'+
      '<ol class="cl-menu-list">'+items().map((it,i)=>'<li style="--i:'+i+'"><a class="cl-mi'+(it.current?' is-current':'')+'" href="'+esc2(it.href)+'"'+(it.ext?' rel="noopener"':'')+(it.current?' aria-current="page" title="'+esc2(t.here)+'"':'')+' tabindex="'+(open?0:-1)+'">'+
        '<span class="cl-mi-n">'+(it.current?'●':String(i+1).padStart(2,'0'))+'</span><span class="cl-mi-t">'+esc2(it.label)+'</span>'+(it.badge?'<span class="cl-live cl-mi-b">'+esc2(it.badge)+'</span>':'')+'<span class="cl-mi-go" aria-hidden="true">'+(it.ext?'↗':'→')+'</span></a></li>').join('')+'</ol>'+
      '<div class="cl-menu-foot"><span>'+esc2(t.connect)+'</span><a href="mailto:hello@cucoarts.com">hello@cucoarts.com</a><a href="https://www.instagram.com/cucoarts/" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div></div>';
    panel.querySelector('.cl-menu-x').onclick=close;
    panel.querySelectorAll('a').forEach(a=>a.onclick=()=>{if(a.getAttribute('aria-current')==='page')close()});
  }
  function setOpen(o){
    open=o; btn.classList.toggle('is-open',o); btn.setAttribute('aria-expanded',String(o)); panel.classList.toggle('is-open',o); panel.setAttribute('aria-hidden',String(!o)); label();
    panel.querySelectorAll('a,button').forEach(el=>el.tabIndex=o?0:-1);
    document.body.style.overflow=o?'hidden':'';
    clearTimeout(rt); panel.classList.remove('is-ready');
    if(o){rt=setTimeout(()=>panel.classList.add('is-ready'),1000);setTimeout(()=>panel.focus({preventScroll:true}),120)}
  }
  function close(){setOpen(false);if(lastFocus)btn.focus()}
  btn.onclick=()=>{
    if(!open){
      render(); lastFocus=btn;
      const r=btn.getBoundingClientRect();
      panel.style.setProperty('--ox',(r.left+r.width/2)+'px'); panel.style.setProperty('--oy',(r.top+r.height/2)+'px');
      requestAnimationFrame(()=>setOpen(true));
    } else close();
  };
  document.addEventListener('keydown',e=>{if(open&&e.key==='Escape'){e.preventDefault();close()}});
  window.addEventListener('orientationchange',()=>{if(open)close()});
  label();
  /* el botón sigue el idioma: se actualiza cuando cambia (el menú se vuelve a dibujar al abrir) */
  const langBtn=document.getElementById('langBtn'); if(langBtn)langBtn.addEventListener('click',()=>setTimeout(label,0));
})();

</script>
