/* colocación de etiquetas sin encimarse */
function layoutLabels(list){
  const placed=[], pinRects=list.map(([id,p])=>({id,r:[p.pin[0]-9,p.pin[0]+9,p.pin[1]-27,p.pin[1]]}));
  const hit=(a,b)=>!(a[1]<b[0]||b[1]<a[0]||a[3]<b[2]||b[3]<a[2]);
  const out={};
  list.slice().sort((a,b)=>a[1].pin[1]-b[1].pin[1]||a[1].pin[0]-b[1].pin[0]).forEach(([id,p])=>{
    const txt=pC(p)+(p.santiago?'*':''), w=txt.length*5.3+4;
    const cands=[]; [0,11,-11,22,-22,33].forEach(dy=>{cands.push({x:p.pin[0]+11,a:'start',dy});cands.push({x:p.pin[0]-11,a:'end',dy})});
    let best=null;
    for(const c of cands){
      const y=p.pin[1]-14+c.dy, r=c.a==='start'?[c.x,c.x+w,y-9,y+2]:[c.x-w,c.x,y-9,y+2];
      if(!placed.some(q=>hit(r,q))&&!pinRects.some(q=>q.id!==id&&hit(r,q.r))){best={x:c.x,y,a:c.a,r};break}
    }
    if(!best){const c=cands[0],y=p.pin[1]-14;best={x:c.x,y,a:c.a,r:[c.x,c.x+w,y-9,y+2]}}
    placed.push(best.r); out[id]=best;
  });
  return out;
}

const GROUPS=[['hoy','g_today'],['manana','g_tomorrow'],['semana','g_week'],['curso','g_curso'],['mes','g_month'],['ano','g_year'],['archivo','g_archive']];
function inMonth(ev,ym){
  const t0=today(), cur=t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0');
  const s=ev.inicio.slice(0,7); let e=(ev.fin||ev.inicio).slice(0,7);
  if(!ev.fin&&ev.finIncierto&&cur>e)e=cur;
  return ym>=s&&ym<=e;
}
function monthList(){
  const t0=today(), set=new Set();
  EVENTS.forEach(ev=>{if(estado(ev).k=='archivo')return;let [y,m]=ev.inicio.slice(0,7).split('-').map(Number);const end=(ev.fin||ev.inicio).slice(0,7);for(let i=0;i<24;i++){const k=y+'-'+String(m).padStart(2,'0');if(k>end)break;set.add(k);m++;if(m>12){m=1;y++}}});
  const cur=t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0');
  return [...set].filter(k=>k>=cur).sort();
}
function monthLabel(ym){const [y,m]=ym.split('-').map(Number);return L({a:MESES_L.es[m-1],a_en:MESES_L.en[m-1]},'a')+(y!==today().getFullYear()?' '+y:'')}
function matches(ev,o){
  const k=estado(ev).k;
  if(k==='archivo'&&o.date!=='archivo')return false;
  if(o.date==='archivo'&&k!=='archivo')return false;
  if(o.zone&&!evZones(ev).includes(o.zone))return false;
  if(o.cat&&o.cat!=='todas'&&ev.cat!==o.cat)return false;
  if(o.mes&&!inMonth(ev,o.mes))return false;
  if(o.date==='abierto'){if(k!=='hoy'&&k!=='curso')return false}   /* abierto hoy = empieza hoy + feria activa + exposiciones en curso */
  else if(o.date&&o.date!=='todos'){const kk=(k==='mas'?'ano':k);if(kk!==o.date)return false}
  return true;
}

function renderEvents(){
  const wrap=$('#evwrap'); if(!wrap)return;
  const sorted=EVENTS.slice().sort((a,b)=>estado(a).orden-estado(b).orden||a.inicio.localeCompare(b.inicio));
  const cnt=k=>sorted.filter(e=>matches(e,{zone:selZone,cat:filtroCat,mes:filtroMes,date:k})).length;
  const filtros=[['todos','f_all'],['abierto','f_open'],['hoy','f_today'],['manana','f_tomorrow'],['semana','f_week'],['curso','f_curso'],['mes','f_month'],['ano','f_year'],['archivo','f_archive']].map(([k,l])=>[k,t(l),cnt(k)]);
  const catChips=[['todas',t('f_all_f'),sorted.filter(e=>matches(e,{zone:selZone,cat:'todas',mes:filtroMes,date:filtro})).length,null]].concat(Object.entries(CATS).map(([k,c])=>[k,cN(c),sorted.filter(e=>matches(e,{zone:selZone,cat:k,mes:filtroMes,date:filtro})).length,c.c]));
  const evs=sorted.filter(e=>matches(e,{zone:selZone,cat:filtroCat,mes:filtroMes,date:filtro==='archivo'?'archivo':'todos'}));
  const nAct=(filtro!=='todos'?1:0)+(filtroCat!=='todas'?1:0)+(filtroMes?1:0);
  const mesChips=monthList().map(k=>[k,monthLabel(k),sorted.filter(e=>matches(e,{zone:selZone,cat:filtroCat,mes:k,date:filtro})).length]);
  const labelF=(filtros.find(f=>f[0]===filtro)||['','',''])[1];
  let body='';
  GROUPS.forEach(([k,lk])=>{
    if(filtro!=='todos'&&filtro!==k&&!(filtro==='abierto'&&(k==='hoy'||k==='curso')))return;
    const l=evs.filter(e=>{const kk=estado(e).k;return (kk==='mas'?'ano':kk)===k});
    if(!l.length)return;
    if(k==='archivo')l.sort((a,b)=>b.inicio.localeCompare(a.inicio));
    body+=`<h3 class="gh">${esc(t(lk))}</h3><div class="grid cols${l.length===1?' one':''}">${l.map(e=>eventCard(e,l.length===1)).join('')}</div>`;

/* ---- Planea tu visita ---- */
function renderVisit(){
  const el=$('#visit'); if(!el)return;
  const live=EVENTS.filter(e=>estado(e).k!=='archivo');
  const cats=Object.keys(CATS).filter(k=>live.some(e=>e.cat===k));
  const chips=[['gratis',t('vis_free')]].concat(cats.map(k=>[k,cN(CATS[k])]));
  let body='';
  if(!visInt.size){body=`<div class="empty">${esc(t('vis_none'))}</div>`}
  else{
    const sel=[...visInt], wantFree=sel.includes('gratis'), wantCats=sel.filter(k=>k!=='gratis');
    const match=live.filter(e=>(!wantCats.length||wantCats.includes(e.cat))&&(!wantFree||e.gratis===true));
    const byPlace={}; match.forEach(e=>{evPlaces(e).forEach(pid=>{(byPlace[pid]=byPlace[pid]||[]).push(e)})});
    const rows=Object.entries(byPlace).sort((a,b)=>b[1].length-a[1].length||(rating('lugar',b[0]).prom||0)-(rating('lugar',a[0]).prom||0));
    body=rows.length?`<h3 class="gh" style="margin-top:6px">${esc(t('vis_results'))}</h3><div class="vcards">${rows.map(([id,evs])=>{
      const p=PLACES[id], z=ZONES[p.zona];
      return `<div class="vcard"><h4>${esc(pN(p))}${p.santiago?' <span class="ast">*</span>':''}</h4>
        <div class="meta"><span class="zdot" style="background:var(${z.color})"></span>${esc(zC(z))} · ${esc(L(p,'tipo'))}</div>
        <div class="row">${[...new Set(evs.map(e=>e.cat))].map(k=>`<span class="cat" style="--c:${CATS[k].c}">${esc(cN(CATS[k]))}</span>`).join('')}</div>
        <div class="meta"><b>${esc(t('vis_ev_n',evs.length+' '+(evs.length===1?t('event_one'):t('event_many'))))}</b>: ${evs.map(e=>esc(eT(e))).join(' · ')}</div>
        ${ratingHTML('lugar',id)}
        <div class="row"><a class="btn alt" href="#/lugar/${id}">${esc(t('vis_see_place'))}</a><button class="btn alt" type="button" data-map="${p.zona}">${esc(t('vis_on_map'))}</button></div></div>`}).join('')}</div>`
      :`<div class="empty">${esc(t('vis_no_match'))}</div>`;
  }
  el.innerHTML=`<h2 class="sec">${esc(t('vis_h'))}</h2><p class="sub">${esc(t('vis_sub'))}</p>
    <div class="vchips" role="group">${chips.map(([k,l])=>`<button class="chip" type="button" data-v="${k}" aria-pressed="${visInt.has(k)}">${esc(l)}</button>`).join('')}</div>${body}`;
  $$('[data-v]',el).forEach(b=>b.onclick=()=>{const k=b.dataset.v;if(visInt.has(k))visInt.delete(k);else visInt.add(k);renderVisit()});
  $$('[data-map]',el).forEach(b=>b.onclick=()=>{selZone=b.dataset.map;renderZonePanel();const m=$('#mapa');if(m)m.scrollIntoView({behavior:'smooth'})});
}

/* ============ BUSCADOR ============
 * Un solo campo arriba de la portada (y un botón 🔍 en el encabezado de todas las páginas). Busca sin acentos ni mayúsculas en
 * eventos, lugares, artistas, ferias y zonas, y muestra los resultados agrupados mientras se escribe.
 * Teclado: ↓ ↑ para moverse, Enter para abrir, Esc para cerrar. */
const nrm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let _sx=null, _sxLang=null;
function srchIndex(){
  if(_sx&&_sxLang===LANG)return _sx;
  const ix=[];
  EVENTS.forEach(e=>{const p=PLACES[e.lugar];ix.push({g:'ev',name:eT(e),hay:nrm([e.titulo,e.titulo_en,e.artista,e.formato,p.nombre,p.corto].join(' ')),sub:pN(p)+' · '+fmtShort(e.inicio),href:'#/evento/'+e.id,badge:badge(e)})});
  Object.entries(PLACES).forEach(([id,p])=>{const z=ZONES[p.zona];ix.push({g:'pl',name:pN(p),hay:nrm([p.nombre,p.nombre_en,p.corto,p.tipo,p.tipo_en,p.dir].join(' ')),sub:zC(z)+' · '+L(p,'tipo'),href:'#/lugar/'+id})});
  Object.entries(typeof ARTISTAS!=='undefined'?ARTISTAS:{}).forEach(([id,a])=>{
    const evs=EVENTS.filter(e=>(e.artistas||[]).includes(id)), ig=(a.ig&&a.verif==='alta')?'https://www.instagram.com/'+a.ig+'/':'';
    if(!evs.length&&!ig)return;
    ix.push({g:'ar',name:a.nombre,hay:nrm([a.nombre].concat(a.alias||[],[a.ig||'']).join(' ')),sub:evs.length?t('srch_n_ev',evs.length+' '+(evs.length===1?t('event_one'):t('event_many'))):'',href:evs.length?'#/evento/'+evs[0].id:ig,ext:!evs.length,ig:evs.length?ig:''});
  });
  Object.entries(FERIAS).forEach(([k,f])=>ix.push({g:'fe',name:f.nombre,hay:nrm(f.nombre+' '+(f.sub||'')),sub:L(f,'sub'),href:'#/feria/'+k}));
  Object.entries(ZONES).forEach(([k,z])=>ix.push({g:'zo',name:zC(z),hay:nrm(z.nombre+' '+(z.corto||'')+' '+k),sub:'',href:'#/zona/'+k}));
  _sxLang=LANG; return (_sx=ix);
}
const SRCH_LIM={ev:6,pl:5,ar:5,fe:3,zo:2}, SRCH_ORD=['ev','pl','ar','fe','zo'];
function srchRun(q){
  const full=nrm(q).trim(); if(!full)return null;
  const toks=full.split(/\s+/);
  const hits=srchIndex().filter(i=>toks.every(tk=>i.hay.includes(tk))).map(i=>({i,s:nrm(i.name).startsWith(full)?0:(nrm(i.name).includes(full)?1:2)}));
  hits.sort((a,b)=>a.s-b.s);
  const out={}, more={}; hits.forEach(h=>{const g=h.i.g;(out[g]=out[g]||[]).push(h.i)});
  SRCH_ORD.forEach(g=>{if(out[g]&&out[g].length>SRCH_LIM[g]){more[g]=out[g].length-SRCH_LIM[g];out[g]=out[g].slice(0,SRCH_LIM[g])}});
  return {out,more,n:hits.length};
}
function srchHTML(r,q){
  if(!r.n)return `<div class="srnone"><p><b>${esc(t('srch_none',q.trim()))}</b></p><p>${esc(t('srch_none_p'))}</p>${tellBtn(t('srch_ph')+': '+q.trim(),'busqueda',t('srch_tell'))}</div>`;
  let k=0, h='';
  SRCH_ORD.forEach(g=>{
    if(!r.out[g])return;
    h+=`<div class="srgrp" role="presentation">${esc(t('srch_'+g))}</div>`+r.out[g].map(i=>{
      const main=`<a class="srmain" role="option" id="sr-${k++}" href="${esc(i.href)}"${i.ext?' target="_blank" rel="noopener nofollow"':''}><span class="srname">${esc(i.name)}${i.ext?' ↗':''}</span>${i.sub?`<span class="srsub">${esc(i.sub)}</span>`:''}</a>`;
      return `<div class="srrow">${main}${i.badge?i.badge:''}${i.ig?`<a class="srig" href="${esc(i.ig)}" target="_blank" rel="noopener nofollow">${esc(t('srch_ig'))}</a>`:''}</div>`;
    }).join('');
    if(r.more[g])h+=`<div class="srmore">+${r.more[g]} · ${esc(t('srch_more'))}</div>`;
  });
  return h;
}
function bindSearch(){
  const q=$('#q'), box=$('#qres'), clr=$('#qclear'); if(!q)return;
  let act=-1;
  const items=()=>$$('.srmain',box);
  const open=v=>{box.hidden=!v;q.setAttribute('aria-expanded',v?'true':'false');if(!v){act=-1;q.removeAttribute('aria-activedescendant')}};
  const mark=()=>{items().forEach((a,i)=>a.classList.toggle('on',i===act));const a=items()[act];if(a){q.setAttribute('aria-activedescendant',a.id);a.scrollIntoView({block:'nearest'})}else q.removeAttribute('aria-activedescendant')};
  const run=()=>{clr.hidden=!q.value;const r=srchRun(q.value);if(!r){open(false);return}box.innerHTML=srchHTML(r,q.value);act=-1;open(true)};
  q.addEventListener('input',run);
  q.addEventListener('focus',()=>{if(q.value.trim())run()});
  q.addEventListener('keydown',e=>{
    const n=items().length;
    if(e.key==='ArrowDown'&&n){e.preventDefault();act=(act+1)%n;mark()}
    else if(e.key==='ArrowUp'&&n){e.preventDefault();act=act<=0?n-1:act-1;mark()}
    else if(e.key==='Enter'){const a=items()[act>=0?act:0];if(a){e.preventDefault();a.click()}}
    else if(e.key==='Escape'){if(!box.hidden){open(false)}else{q.value='';clr.hidden=true}}
  });

const lbEl=$('#lb'); let lb={ev:null,i:0};
/* tamaño dinámico: lo más grande posible dentro de la ventana, sin pasar de 1.8 veces el tamaño real de la imagen */
function lbFit(){
  const im=$('#lbImg'); if(!im.naturalWidth)return;
  const vw=innerWidth-(innerWidth<820?100:170), vh=innerHeight-150;
  const k=Math.min(vw/im.naturalWidth,vh/im.naturalHeight,1.8);
  im.style.width=Math.round(im.naturalWidth*k)+'px'; im.style.height=Math.round(im.naturalHeight*k)+'px';
}
$('#lbImg').addEventListener('load',lbFit);
window.addEventListener('resize',()=>{if(!lbEl.hidden)lbFit()});
function lbShow(){
  const imgs=lb.ev.imgs, n=imgs.length;
  const im=$('#lbImg'); im.style.width=''; im.style.height='';
  im.src=imgs[lb.i]; im.alt=eT(lb.ev); if(im.complete)lbFit();
  $('#lbCount').textContent=(lb.i+1)+' / '+n; $('#lbCap').textContent=L(lb.ev,'credito');
  $('#lbPrev').hidden=n<2; $('#lbNext').hidden=n<2; $('#lbPrev').disabled=lb.i===0; $('#lbNext').disabled=lb.i===n-1; $('#lbFirst').hidden=n<2||lb.i===0;
}
function openLB(ev,i){lb={ev,i};lbEl.hidden=false;document.body.style.overflow='hidden';lbShow();$('#lbClose').focus()}
function closeLB(){
  lbEl.hidden=true;document.body.style.overflow='';
  galIdx=lb.i; const gi=$('#galImg'); if(gi&&lb.ev)gi.src=lb.ev.imgs[galIdx];
  $$('#galThumbs button').forEach((b,k)=>b.setAttribute('aria-current',k===galIdx));
}
function lbGo(d){const n=lb.ev.imgs.length;const j=Math.max(0,Math.min(n-1,lb.i+d));if(j!==lb.i){lb.i=j;lbShow()}}
$('#lbPrev').onclick=()=>lbGo(-1); $('#lbNext').onclick=()=>lbGo(1);
$('#lbFirst').onclick=()=>{lb.i=0;lbShow()}; $('#lbClose').onclick=closeLB;
lbEl.addEventListener('mousedown',e=>{if(e.target===lbEl)closeLB()});
let tx0=null;
lbEl.addEventListener('touchstart',e=>{tx0=e.touches[0].clientX},{passive:true});
lbEl.addEventListener('touchend',e=>{if(tx0==null)return;const dx=e.changedTouches[0].clientX-tx0;tx0=null;if(Math.abs(dx)>50)lbGo(dx<0?1:-1)},{passive:true});

/* teclado y menús */
document.addEventListener('keydown',e=>{

    if(e.key==='Escape')closeLB(); else if(e.key==='ArrowRight')lbGo(1); else if(e.key==='ArrowLeft')lbGo(-1); else if(e.key==='Home'){lb.i=0;lbShow()}

/* ============ NAVEGACIÓN ============ */
/* No depende del hash del navegador: funciona igual al abrir el archivo, en una vista previa, en un artifact o en el sitio. */
let current=location.hash||'#/';
const hist=[];
function anchorTo(h){
  const id=h.slice(1);
  if(!$('#'+id)){current='#/';route();}
  setTimeout(()=>{const m=$('#'+id);if(m)m.scrollIntoView({behavior:'smooth'})},40);
}
try{history.scrollRestoration='manual'}catch(e){}
/* botón flotante "subir": aparece en evento, lugar, feria y zona cuando ya se bajó un poco */
(function(){
  const b=$('#toTop'); if(!b)return;
  const upd=()=>{b.hidden=!(window.scrollY>500&&current&&current!=='#/')};
  window.addEventListener('scroll',upd,{passive:true}); b.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  window.__updTop=upd;
})();
function go2(h){
  if(h==='#mapa'||h==='#evsec'){anchorTo(h);return}
  if(window.__fromMap&&h.startsWith('#/lugar/')){mapReturn={zone:selZone,pin:h.split('/')[2]};}
  window.__fromMap=false;
  if(h!==current){scrollMap[current]=window.scrollY;hist.push(current)}
  /* entrar a la portada o a una zona desde otra página empieza limpio: un filtro de fecha o categoría olvidado dejaba la lista vacía (Volver sí los conserva) */
  if(h==='#/'||h.startsWith('#/zona/')){filtro='todos';filtroCat='todas';filtroMes=null}
  if(h==='#/')selZone=null;   /* "Hoy" / el logo llevan a la portada completa, no a la última zona vista */
  current=h;
  try{history.pushState(null,'',h)}catch(e){}
  route();
}
/* recuerda hasta dónde se había bajado en cada página para volver exactamente ahí */
const scrollMap={};
window.addEventListener('scroll',()=>{if(current)scrollMap[current]=window.scrollY},{passive:true});
function goBack(){
  current=hist.length?hist.pop():'#/';
  if(scrollMap[current]>0)window.__restoreY=scrollMap[current];
  try{history.pushState(null,'',current)}catch(e){}
  if(current==='#/'&&mapReturn){selZone=mapReturn.zone;selPin=mapReturn.pin;window.__toMap=true;mapReturn=null}

/* ============ ME GUSTA (corazón con las letras de CUCO ARTS): un toque, un like por persona ============ */
function closeLike(){$('#likeOverlay').classList.remove('open');document.body.style.overflow='';clearTimeout(window.__lkT)}
function showLike(id,msg){
  $('#lkPlace').textContent=pN(PLACES[id]); $('#lkLead').textContent=msg||t('like_lead');
  $('#likeOverlay').classList.add('open'); document.body.style.overflow='hidden';
  clearTimeout(window.__lkT); window.__lkT=setTimeout(closeLike,3800);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-like]'); if(!b)return; e.preventDefault(); e.stopPropagation();
  const id=b.dataset.like;
  if(likeDone(id)){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
  if(b.dataset.busy)return; b.dataset.busy='1';
  const done=()=>{
    likeMark(id);
    if(!API){try{localStorage.setItem('mty_ln_'+id,String(likeCount(id)+1))}catch(x){}}
    refreshLikes(id);
    const nb=document.querySelector('[data-like="'+id+'"] .hpv'); if(nb){nb.classList.add('boom');sparkle(nb)}
    showLike(id);
  };
  if(API){
    const res=await apiSubmit({tipo:'like',ref:'lugar:'+id,dev:devId()});
    if(res.ok){const a=AGG['lugar:'+id]||(AGG['lugar:'+id]={n:0,sum:0});a.l=(a.l|0)+1;done()}
    else if(res.status===409){likeMark(id);refreshLikes(id)}
    else{delete b.dataset.busy;showLike(id,t(res.status===429?'like_limit':'like_err'))}
  }else done();
},true);
$('#likeClose').onclick=closeLike; $('#lkOk').onclick=closeLike;
$('#likeOverlay').addEventListener('mousedown',e=>{if(e.target.id==='likeOverlay')closeLike()});

/* Cerrar ventanas con gestos: arrastrar hacia abajo (estando arriba del todo) o pellizcar hacia dentro con dos dedos. */
$$('.overlay').forEach(ov=>{
  let y0=null, d0=0, closed=false;
  const x=()=>ov.querySelector('.x');
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  ov.addEventListener('touchstart',e=>{
    closed=false;
    if(e.touches.length===2){d0=dist(e.touches);y0=null}
    else if(e.touches.length===1){d0=0;y0=ov.scrollTop<=0?e.touches[0].clientY:null}
  },{passive:true});
  ov.addEventListener('touchmove',e=>{
    if(closed)return;
    if(e.touches.length===2&&d0&&dist(e.touches)<d0*0.7){closed=true;const b=x();if(b)b.click()}
    else if(e.touches.length===1&&y0!==null&&e.touches[0].clientY-y0>110&&ov.scrollTop<=0){closed=true;const b=x();if(b)b.click()}
  },{passive:true});
});

/* ============ MENÚ DE CUCOARTS.COM (solo en la página pública) ============ */
/* Mismas secciones, orden y etiquetas que SiteMenu.tsx de la landing. "Eventos" es esta página. */
(function(){
  if(!window.MTY_RO)return;
  const TXT={
    es:{menu:'Menú',close:'Cerrar menú',home:'Inicio',here:'estás aquí',label:'Menú principal',connect:'Escríbenos',store:'Tienda',murals:'Murales',art:'Arte por encargo',sell:'Vende tu obra',expo:'Expo en Santiago',events:'Eventos',fresh:'Nuevo',live:'Activa'},
    en:{menu:'Menu',close:'Close menu',home:'Home',here:'you are here',label:'Main menu',connect:'Write to us',store:'Store',murals:'Murals',art:'Custom art',sell:'Sell your art',expo:'Expo in Santiago',events:'Events',fresh:'New',live:'Live'}
  };
  const lp=(en,p)=>en?(p==='/'?'/en':'/en'+({'/murales':'/murals','/arte-por-encargo':'/custom-art'}[p]||p)):p;
  function items(){
    const en=LANG==='en', t=TXT[LANG];
    return [
      {id:'home',label:t.home,href:lp(en,'/')},
      {id:'store',label:t.store,href:'https://store.cucoarts.com',ext:true},
      {id:'murales',label:t.murals,href:lp(en,'/murales'),badge:t.fresh},
      {id:'arte',label:t.art,href:lp(en,'/arte-por-encargo'),badge:t.fresh},
      {id:'sell',label:t.sell,href:lp(en,'/')+'#vende'},
      {id:'husky',label:t.expo,href:lp(en,'/husky'),badge:t.live},
      {id:'events',label:t.events,href:'/mty',badge:t.fresh,current:true}
    ];
  }
  const nav=document.querySelector('.top .nav'); if(!nav)return;
  const btn=document.createElement('button'); btn.type='button'; btn.className='cl-menubtn'; btn.setAttribute('aria-expanded','false'); btn.setAttribute('aria-controls','site-menu');
  btn.innerHTML='<span class="cl-menuicon" aria-hidden="true"><i></i><i></i><i></i></span><span class="cl-menutxt"></span>';
  nav.appendChild(btn);
  const panel=document.createElement('div'); panel.id='site-menu'; panel.className='cl-menu'; panel.tabIndex=-1; panel.setAttribute('role','dialog'); panel.setAttribute('aria-modal','true'); panel.setAttribute('aria-hidden','true');
  document.body.appendChild(panel);
  let open=false, lastFocus=null, rt=null;
  const esc2=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function label(){btn.querySelector('.cl-menutxt').textContent=open?TXT[LANG].close:TXT[LANG].menu}
  function render(){
    const t=TXT[LANG];
    panel.setAttribute('aria-label',t.label);
    panel.innerHTML='<div class="cl-menu-in"><div class="cl-menu-top"><span class="cl-menu-logo" aria-hidden="true"></span><button type="button" class="cl-menu-x" aria-label="'+esc2(t.close)+'"><span aria-hidden="true">✕</span></button></div>'+
      '<ol class="cl-menu-list">'+items().map((it,i)=>'<li style="--i:'+i+'"><a class="cl-mi'+(it.current?' is-current':'')+'" href="'+esc2(it.href)+'"'+(it.ext?' rel="noopener"':'')+(it.current?' aria-current="page" title="'+esc2(t.here)+'"':'')+' tabindex="'+(open?0:-1)+'">'+
        '<span class="cl-mi-n">'+(it.current?'●':String(i+1).padStart(2,'0'))+'</span><span class="cl-mi-t">'+esc2(it.label)+'</span>'+(it.badge?'<span class="cl-live cl-mi-b">'+esc2(it.badge)+'</span>':'')+'<span class="cl-mi-go" aria-hidden="true">'+(it.ext?'↗':'→')+'</span></a></li>').join('')+'</ol>'+
      '<div class="cl-menu-foot"><span>'+esc2(t.connect)+'</span><a href="mailto:hello@cucoarts.com">hello@cucoarts.com</a><a href="https://www.instagram.com/cucoarts/" target="_blank" rel="noopener noreferrer">Instagram ↗</a></div></div>';
    panel.querySelector('.cl-menu-x').onclick=close;
    panel.querySelectorAll('a').forEach(a=>a.onclick=()=>{if(a.getAttribute('aria-current')==='page')close()});
  }
  function setOpen(o){
    open=o; btn.classList.toggle('is-open',o); btn.setAttribute('aria-expanded',String(o)); panel.classList.toggle('is-open',o); panel.setAttribute('aria-hidden',String(!o)); label();
    panel.querySelectorAll('a,button').forEach(el=>el.tabIndex=o?0:-1);
    document.body.style.overflow=o?'hidden':'';
    clearTimeout(rt); panel.classList.remove('is-ready');
    if(o){rt=setTimeout(()=>panel.classList.add('is-ready'),1000);setTimeout(()=>panel.focus({preventScroll:true}),120)}
  }
  function close(){setOpen(false);if(lastFocus)btn.focus()}
  btn.onclick=()=>{
    if(!open){
      render(); lastFocus=btn;
      const r=btn.getBoundingClientRect();
      panel.style.setProperty('--ox',(r.left+r.width/2)+'px'); panel.style.setProperty('--oy',(r.top+r.height/2)+'px');
      requestAnimationFrame(()=>setOpen(true));
    } else close();
  };
  document.addEventListener('keydown',e=>{if(open&&e.key==='Escape'){e.preventDefault();close()}});
  window.addEventListener('orientationchange',()=>{if(open)close()});
  label();
  /* el botón sigue el idioma: se actualiza cuando cambia (el menú se vuelve a dibujar al abrir) */
  const langBtn=document.getElementById('langBtn'); if(langBtn)langBtn.addEventListener('click',()=>setTimeout(label,0));
})();
