<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Certificado CA-2026-001 · Norte · Romualdo Castañeda · CUCO ARTS</title>
<style>
/* Versión imprimible / PDF del certificado. Carta horizontal (279.4 × 215.9 mm): en México es el papel de uso diario,
   el horizontal da una columna para la foto y dos para la historia completa sin recortar palabras del artista,
   y cabe en una sola hoja. Márgenes de 12 mm (impresión segura ≥ 10 mm). Fondo blanco: no gasta tinta en negro. */
@font-face{font-family:"Neue Montreal";src:url(/mty/fonts/NeueMontreal-Regular.otf);font-weight:400}
@font-face{font-family:"Neue Montreal";src:url(/mty/fonts/NeueMontreal-Medium.otf);font-weight:500}
@font-face{font-family:"Neue Montreal";src:url(/mty/fonts/NeueMontreal-Bold.otf);font-weight:700}
@font-face{font-family:"Courier Prime";src:url(/mty/fonts/CourierPrime-Bold.ttf);font-weight:700}
@page{size:279.4mm 215.9mm;margin:12mm}
:root{--ink:#232322;--mut:#5d5955;--yel:#F7D649;--lime:#C8F34A;--blue:#067DFF}
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{margin:0;background:#fff;color:var(--ink);font:8.4pt/1.42 "Neue Montreal","Hanken Grotesk","Helvetica Neue",Arial,sans-serif}
.tools{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:#F5F1F1;border-bottom:2.5px solid var(--ink);font-size:15px}
.tools button,.tools a{font:inherit;font-weight:500;border:2.5px solid var(--ink);background:var(--yel);color:var(--ink);padding:9px 18px;border-radius:999px;cursor:pointer;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.tools a{background:#fff}
.tools button:focus-visible,.tools a:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.stage{padding:18px;background:#d9d5d5;overflow:auto}
.paper{width:279.4mm;height:215.9mm;margin:0 auto;background:#fff;padding:12mm;box-shadow:0 2px 14px rgba(0,0,0,.25)}
.sheet{width:255.4mm;height:191.9mm;display:grid;grid-template-rows:auto 1fr auto;row-gap:4.5mm;overflow:hidden}
.mono{font-family:"Courier Prime","Courier New",monospace;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
/* encabezado */
.hd{display:flex;align-items:center;justify-content:space-between;gap:8mm;border-bottom:.8mm solid var(--ink);padding-bottom:3mm}
.hd img{height:15mm;width:auto;display:block}
.hd .r{display:flex;align-items:center;gap:5mm;text-align:right}
.hd .t{font-size:7.5pt;line-height:1.5}
.hd .t b{display:block;font-size:10pt;letter-spacing:.04em}
.sello{display:flex;align-items:center;gap:2.2mm;background:var(--lime);border:.7mm solid var(--ink);box-shadow:1.2mm 1.2mm 0 var(--ink);padding:1.6mm 3.6mm 1.6mm 2mm;font-weight:700;font-size:9pt;white-space:nowrap}
.sello i{font-style:normal;width:6mm;height:6mm;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center;font-size:9pt}
/* cuerpo */
.bd{display:grid;grid-template-columns:76mm 1fr;column-gap:9mm;min-height:0}
.ca{display:flex;flex-direction:column;gap:5mm;min-height:0}
.ph{width:71mm;height:86mm;border:.8mm solid var(--ink);box-shadow:2.4mm 2.4mm 0 var(--yel),2.4mm 2.4mm 0 .8mm var(--ink);margin:0 0 0 0;background:#fff;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.qr{display:grid;grid-template-columns:29mm 1fr;gap:4mm;align-items:center;border:.7mm solid var(--ink);padding:2.2mm;margin-top:2mm}
.qr img{width:29mm;height:29mm;display:block}
.qr p{margin:0;font-size:7.4pt;line-height:1.35}
.qr .mono{display:block;font-size:6.6pt;margin-bottom:1mm}
.qr .u{font-family:"Courier Prime","Courier New",monospace;font-weight:700;font-size:6.6pt;overflow-wrap:anywhere;margin-top:1.4mm;display:block}
.cb{display:flex;flex-direction:column;min-height:0}
h1{font-size:50pt;line-height:.86;letter-spacing:-.04em;text-transform:uppercase;margin:0 0 2.4mm;font-weight:700}
.tag{display:inline-block;align-self:flex-start;background:var(--yel);padding:.6mm 3mm;font-size:8.5pt;transform:rotate(-1.2deg);margin-bottom:4mm;border:.5mm solid var(--ink)}
.fi{display:grid;grid-template-columns:1fr 1fr;border:.7mm solid var(--ink)}
.fi div{padding:1.5mm 3mm;border-bottom:.5mm solid var(--ink)}
.fi div:nth-child(odd){border-right:.5mm solid var(--ink)}
.fi div:nth-last-child(-n+2){border-bottom:0}
.fi span{display:block;font-size:6.2pt;color:var(--mut)}
.fi b{font-size:9.6pt;font-weight:500;line-height:1.25}
.tlm{display:grid;grid-template-columns:repeat(3,1fr);gap:4mm;margin:4mm 0 3.5mm}
.tlm div{border-left:1.2mm solid var(--yel);padding-left:2.4mm;line-height:1.3}
.tlm .mono{font-size:6.2pt;color:#0553b8;display:block}
.tlm b{font-size:9pt;display:block;font-weight:700;letter-spacing:-.01em}
.tlm small{font-size:6.6pt;color:var(--mut)}
.st h2{font-family:"Courier Prime","Courier New",monospace;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:7pt;margin:0 0 1.8mm}
.cols{column-count:2;column-gap:7mm}
.cols section{break-inside:avoid;margin:0 0 2.6mm}
.cols h3{font-size:10.2pt;letter-spacing:-.015em;margin:0 0 .8mm;font-weight:700;line-height:1.1}
.cols p{margin:0 0 1.5mm;font-size:8.2pt;line-height:1.38}
/* pie */
.ft{border-top:.5mm solid var(--ink);padding-top:2.4mm;display:flex;justify-content:space-between;gap:8mm;font-size:6.8pt;line-height:1.35;color:var(--mut)}
.ft b{color:var(--ink)}
.ft .mono{white-space:nowrap;color:var(--ink);font-size:6.6pt}
@media print{
 .tools,.stage{padding:0}
 .tools{display:none}
 .stage{background:#fff;overflow:visible}
 .paper{box-shadow:none;margin:0;padding:0;width:auto;height:auto}
 .sheet{width:255.4mm;height:191.9mm}
 html,body{height:auto}
}
</style>
</head>
<body>
<div class="tools" id="tools"><button type="button" id="pr">Imprimir o guardar como PDF</button><a id="back" href="./">Volver al certificado</a><span>Carta horizontal · 1 hoja · fondo claro</span></div>
<div class="stage"><div class="paper"><div class="sheet" id="sheet"></div></div></div>
<script>
(async()=>{
 const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
 const q=new URLSearchParams(location.search),id=(q.get("c")||"CA-2026-001").replace(/[^A-Za-z0-9-]/g,"").toUpperCase();
 $("#back").href="/certificado/"+id;
 let C;try{C=await (await fetch(`/certificado/datos/${id}.json`)).json()}catch(e){$("#sheet").textContent="No encontramos este certificado.";return}
 document.title=`Certificado ${C.id} · ${C.titulo} · ${C.artista.nombre} · CUCO ARTS`;
 const g=k=>(C.ficha.find(f=>f.k===k)||{}).v||"";
 const filas=["Título","Artista","Técnica","Medidas","Marco","Hecho en"].filter(k=>g(k)).map(k=>`<div><span class="mono">${k}</span><b>${esc(g(k))}</b></div>`).join("");
 const hist=(C.historia||[]).map(h=>`<section><h3>${h.e} ${esc(h.t)}</h3>${h.p.map(p=>`<p>${esc(p)}</p>`).join("")}</section>`).join("");
 const tl=(C.fechas||[]).map(f=>`<div><span class="mono">${esc(f.cuando)}</span><b>${esc(f.t)}</b>${f.fuente?`<small>${esc(f.fuente)}</small>`:""}</div>`).join("");
 $("#sheet").innerHTML=`
 <div class="hd"><img src="/certificado/img/logo-cuco-tinta.png" alt="CUCO ARTS"><div class="r"><div class="t mono">Certificado de autenticidad<b>N.º ${esc(C.id)}</b></div><div class="sello"><i>${C.estado==="Registrado"?"✓":"…"}</i>CUCO ARTS · ${esc(C.emitido_txt)}</div></div></div>
 <div class="bd">
  <div class="ca"><figure class="ph"><img src="${esc(C.imagen_principal.src)}" alt="${esc(C.imagen_principal.alt)}"></figure>
   <div class="qr"><img src="/certificado/img/qr-${esc(C.id)}.svg" alt="Código QR de verificación"><p><span class="mono">Verifica este certificado</span>Escanea el código para confirmar que existe en el registro de CUCO ARTS.<span class="u">${esc(C.url_futura.replace("https://","")).replace("certificado/","certificado/<wbr>")}</span></p></div>
  </div>
  <div class="cb">
   <h1>${esc(C.titulo)}</h1><div class="tag mono">${esc(C.artista.nombre)}</div>
   <div class="fi">${filas}</div>
   ${C.edicion?`<div class="st"><h2>${esc(C.edicion.titulo)}</h2><p>${esc(C.edicion.texto)}</p><div class="fi">${C.edicion.ejemplares.map(e=>`<div><span class="mono">Ejemplar</span><b>${esc(e.n)} · ${esc(e.propietario)}</b></div>`).join("")}</div></div>`:""}
   ${tl?`<div class="tlm">${tl}</div>`:""}
   ${hist?`<div class="st"><h2>${esc(C.historia_titulo)}</h2><div class="cols">${hist}</div></div>`:""}
  </div>
 </div>
 <div class="ft"><div><b>Documentación de procedencia.</b> Este certificado registra la obra, su autor y su historia con la información disponible a la fecha de emisión. No es un avalúo y no promete valor, inversión ni plusvalía.</div><div class="mono">${esc(C.id)} · cucoarts.com</div></div>`;
 $("#pr").onclick=()=>window.print();
 if(q.get("imprimir")==="1"){
  try{await document.fonts.ready}catch(e){}
  await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));
  setTimeout(()=>window.print(),350);
 }
})();
</script>
</body>
</html>
