service: cucoarts-sls-v2
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

provider:
  name: aws
  runtime: nodejs20.x
  profile: cucoarts
  region: us-east-2
  memorySize: 128
  timeout: 20
  lambdaHashingVersion: 20201221
  stage: ${opt:stage, 'dev'}
  apiGateway:
    apiKeys:
      - ${sls:stage}-cucoarts-apikey
      - ${sls:stage}-cucoarts-mty-apikey   # llave de /mty: la cuota del plan se cuenta por llave, así no compite con los formularios
    # límite de uso: el formulario del sitio es público, así que se acota el abuso
    usagePlan:
      quota:
        limit: 20000
        period: DAY
      throttle:
        burstLimit: 20
        rateLimit: 10
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource: !GetAtt RequestsTable.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub "${UploadsBucket.Arn}/*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        # agenda /mty: solo su tabla y solo su secreto de firma
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource: !GetAtt MtyTable.Arn
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${self:custom.mtySecretParam}"

package:
  individually: true
  excludeDevDependencies: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.vscode/**'
    - '!frontend/**'

plugins:
  - serverless-s3-sync
  - serverless-offline

functions:
  getArt:
    name: ${sls:stage}-getArt-lambda
    handler: backend/lambda/art-get/index.getArt
    events:
      - http:
          path: art
          method: get
          private: true
          cors: true
    environment:
      BUCKET: ${self:custom.imagesBucketName}
      APP_ACCESS_KEY: ${ssm:cucoarts-access-key}
      APP_SECRET: ${ssm:cucoarts-secret-key}

  requestsUploadUrl:
    name: ${sls:stage}-requestsUploadUrl-lambda
    handler: backend/lambda/requests/index.uploadUrl
    memorySize: 256
    events:
      - http:
          path: requests/upload-url
          method: post
          private: true
          cors: true
    environment:
      UPLOADS_BUCKET: ${self:custom.uploadsBucketName}

  requestsSubmit:
    name: ${sls:stage}-requestsSubmit-lambda
    handler: backend/lambda/requests/index.submit
    memorySize: 256
    timeout: 25
    events:
      - http:
          path: requests
          method: post
          private: true
          cors: true
    environment:
      REQUESTS_TABLE: ${self:custom.requestsTableName}
      UPLOADS_BUCKET: ${self:custom.uploadsBucketName}
      NOTIFY_TO: ${self:custom.notifyEmail}
      NOTIFY_FROM: ${self:custom.notifyEmail}

  # ---- agenda cucoarts.com/mty: check-ins, calificaciones y recomendaciones con moderación por correo ----
  mtySubmit:
    name: ${sls:stage}-mtySubmit-lambda
    handler: backend/lambda/mty/index.submit
    memorySize: 256
    timeout: 15
    events:
      - http:
          path: mty/submit
          method: post
          private: true
          cors: true
    environment:
      MTY_TABLE: ${self:custom.mtyTableName}
      MTY_SECRET_PARAM: ${self:custom.mtySecretParam}
      NOTIFY_TO: ${self:custom.notifyEmail}
      NOTIFY_FROM: ${self:custom.notifyEmail}
      MAX_MAIL_DAY: '30'
      MOD_BASE: !GetAtt MtyModerateLambdaFunctionUrl.FunctionUrl

  mtyPublic:
    name: ${sls:stage}-mtyPublic-lambda
    handler: backend/lambda/mty/index.publicList
    memorySize: 256
    timeout: 10
    events:
      - http:
          path: mty/public
          method: get
          private: true
          cors: true
    environment:
      MTY_TABLE: ${self:custom.mtyTableName}

  # Los enlaces del correo no pueden llevar llave de API, así que la moderación vive en una URL de función propia (sin API Gateway,
  # sin costo por llamada). La protegen la firma (HMAC) y que abrirla no cambia nada; `reservedConcurrency: 1` limita el ritmo
  # y sirve de freno: ponerla en 0 apaga la moderación al instante si hiciera falta.
  mtyModerate:
    name: ${sls:stage}-mtyModerate-lambda
    handler: backend/lambda/mty/index.moderate
    timeout: 10
    reservedConcurrency: 1
    url: true
    environment:
      MTY_TABLE: ${self:custom.mtyTableName}
      MTY_SECRET_PARAM: ${self:custom.mtySecretParam}

custom:
  bucketName: cucoarts-sls-v2-deploy-assets
  imagesBucketName: cucoarts-image-assets
  # solicitudes del sitio (cotizador artístico y registro de artistas)
  uploadsBucketName: cucoarts-sls-v2-request-uploads-${sls:stage}
  requestsTableName: ${sls:stage}-cucoarts-requests
  notifyEmail: roberto@cucoarts.com
  # agenda /mty (el secreto de firma es un parámetro SecureString creado a mano; no vive en el repo)
  mtyTableName: ${sls:stage}-cucoarts-mty
  mtySecretParam: cucoarts-mty-secret
  budgetUsd: 5
  s3Sync:
    - bucketName: ${self:custom.bucketName}
      localDir: frontend/build/
      # Pages without extension (cucoarts.com/rob) must be served as HTML, not as a download.
      defaultContentType: text/html; charset=utf-8
      params:
        - rob:
            ContentType: text/html; charset=utf-8
            CacheControl: max-age=300
        # Images: 7 days in the browser so returning visitors don't download them again. ONLY image files inside these
        # folders (never pages such as murales/index.html or husky/index.html, nor the JS/CSS bundles); if an image is
        # replaced under the same name, visitors who already have it keep the old one for up to a week, so prefer new
        # file names for new images.
        - landing-pool/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800
        - obra/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800
        - murales/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800
        - husky/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800
        - mty/img/*.jpg:
            CacheControl: public, max-age=604800
        - rob-galeria/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800
        - rob-media/**/*.{jpg,jpeg,png,webp}:
            CacheControl: public, max-age=604800

resources:
  Resources:
    RequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.requestsTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    MtyTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.mtyTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: pk
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: pk
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: expira
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    # Alerta de gasto de toda la cuenta: avisa por correo a la mitad, al 80 % y al pasar de ${self:custom.budgetUsd} USD en el mes.
    # Desde oct-2025 una URL de función pública necesita, además del permiso InvokeFunctionUrl que crea Serverless,
    # este permiso InvokeFunction (solo cuando la llamada llega por la URL). Sin él la URL responde 403.
    MtyModerateInvokeViaUrl:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !Ref MtyModerateLambdaFunction
        Action: lambda:InvokeFunction
        Principal: '*'
        InvokedViaFunctionUrl: true
    MonthlyBudget:
      Type: AWS::Budgets::Budget
      Properties:
        Budget:
          BudgetName: cucoarts-mensual-${sls:stage}
          BudgetType: COST
          TimeUnit: MONTHLY
          BudgetLimit:
            Amount: ${self:custom.budgetUsd}
            Unit: USD
        NotificationsWithSubscribers:
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 50
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${self:custom.notifyEmail}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 80
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${self:custom.notifyEmail}
          - Notification:
              NotificationType: ACTUAL
              ComparisonOperator: GREATER_THAN
              Threshold: 100
              ThresholdType: PERCENTAGE
            Subscribers:
              - SubscriptionType: EMAIL
                Address: ${self:custom.notifyEmail}
    UploadsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.uploadsBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: expire-uploads
              Status: Enabled
              Prefix: uploads/
              ExpirationInDays: 180
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - https://cucoarts.com
                - https://www.cucoarts.com
                - http://localhost:3000
              AllowedMethods:
                - PUT
              AllowedHeaders:
                - "*"
              MaxAge: 3000
    # Correo desde el que el sitio avisa de nuevas solicitudes; AWS manda un enlace de verificación a esta dirección.
    NotifyEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: ${self:custom.notifyEmail}
    ReactAppBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    S3AccessPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ReactAppBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::${self:custom.bucketName}/*
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.bucketName}.s3.amazonaws.com
              Id: ReactApp
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
          Enabled: "true"
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            TargetOriginId: ReactApp
            ForwardedValues:
              QueryString: "false"
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
