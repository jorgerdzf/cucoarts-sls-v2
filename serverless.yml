service: cucoarts-sls-v2
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

provider:
  name: aws
  runtime: nodejs20.x
  profile: cucoarts
  region: us-east-2
  memorySize: 128
  timeout: 20
  lambdaHashingVersion: 20201221
  stage: ${opt:stage, 'dev'}
  apiGateway:
    apiKeys:
      - ${sls:stage}-cucoarts-apikey
    # límite de uso: el formulario del sitio es público, así que se acota el abuso
    usagePlan:
      quota:
        limit: 5000
        period: DAY
      throttle:
        burstLimit: 20
        rateLimit: 10
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource: !GetAtt RequestsTable.Arn
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: !Sub "${UploadsBucket.Arn}/*"
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"

package:
  individually: true
  excludeDevDependencies: true
  patterns:
    - '!node_modules/**'
    - '!.git/**'
    - '!.vscode/**'
    - '!frontend/**'

plugins:
  - serverless-s3-sync
  - serverless-offline

functions:
  getArt:
    name: ${sls:stage}-getArt-lambda
    handler: backend/lambda/art-get/index.getArt
    events:
      - http:
          path: art
          method: get
          private: true
          cors: true
    environment:
      BUCKET: ${self:custom.imagesBucketName}
      APP_ACCESS_KEY: ${ssm:cucoarts-access-key}
      APP_SECRET: ${ssm:cucoarts-secret-key}

  requestsUploadUrl:
    name: ${sls:stage}-requestsUploadUrl-lambda
    handler: backend/lambda/requests/index.uploadUrl
    memorySize: 256
    events:
      - http:
          path: requests/upload-url
          method: post
          private: true
          cors: true
    environment:
      UPLOADS_BUCKET: ${self:custom.uploadsBucketName}

  requestsSubmit:
    name: ${sls:stage}-requestsSubmit-lambda
    handler: backend/lambda/requests/index.submit
    memorySize: 256
    timeout: 25
    events:
      - http:
          path: requests
          method: post
          private: true
          cors: true
    environment:
      REQUESTS_TABLE: ${self:custom.requestsTableName}
      UPLOADS_BUCKET: ${self:custom.uploadsBucketName}
      NOTIFY_TO: ${self:custom.notifyEmail}
      NOTIFY_FROM: ${self:custom.notifyEmail}

custom:
  bucketName: cucoarts-sls-v2-deploy-assets
  imagesBucketName: cucoarts-image-assets
  # solicitudes del sitio (cotizador artístico y registro de artistas)
  uploadsBucketName: cucoarts-sls-v2-request-uploads-${sls:stage}
  requestsTableName: ${sls:stage}-cucoarts-requests
  notifyEmail: roberto@cucoarts.com
  s3Sync:
    - bucketName: ${self:custom.bucketName}
      localDir: frontend/build/
      # Pages without extension (cucoarts.com/rob) must be served as HTML, not as a download.
      defaultContentType: text/html; charset=utf-8
      params:
        - rob:
            ContentType: text/html; charset=utf-8
            CacheControl: max-age=300
        # Images: 7 days in the browser so returning visitors don't download them again. Only folders of images
        # (never the pages or the JS/CSS bundles); if an image is replaced under the same name, visitors who already
        # have it keep the old one for up to a week, so prefer new file names for new images.
        - landing-pool/**:
            CacheControl: public, max-age=604800
        - obra/**:
            CacheControl: public, max-age=604800
        - murales/**:
            CacheControl: public, max-age=604800
        - husky/**:
            CacheControl: public, max-age=604800
        - rob-galeria/**:
            CacheControl: public, max-age=604800
        - rob-media/**:
            CacheControl: public, max-age=604800

resources:
  Resources:
    RequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:custom.requestsTableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
    UploadsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.uploadsBucketName}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - Id: expire-uploads
              Status: Enabled
              Prefix: uploads/
              ExpirationInDays: 180
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - https://cucoarts.com
                - https://www.cucoarts.com
                - http://localhost:3000
              AllowedMethods:
                - PUT
              AllowedHeaders:
                - "*"
              MaxAge: 3000
    # Correo desde el que el sitio avisa de nuevas solicitudes; AWS manda un enlace de verificación a esta dirección.
    NotifyEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: ${self:custom.notifyEmail}
    ReactAppBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.bucketName}
        AccessControl: PublicRead
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
    S3AccessPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ReactAppBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action:
                - s3:GetObject
              Resource: arn:aws:s3:::${self:custom.bucketName}/*
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: ${self:custom.bucketName}.s3.amazonaws.com
              Id: ReactApp
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
          Enabled: "true"
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            TargetOriginId: ReactApp
            ForwardedValues:
              QueryString: "false"
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            CloudFrontDefaultCertificate: true
